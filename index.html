<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mishu's Yarn Hunt ✨</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }

  body {
    background: #0a0a1a;
    overflow: hidden;
    font-family: 'Nunito', sans-serif;
    width: 100vw;
    height: 100vh;
  }

  #gameCanvas {
    display: block;
    position: absolute;
    top: 0; left: 0;
    image-rendering: pixelated;
  }

  /* HUD */
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    pointer-events: none;
    z-index: 10;
  }

  .hud-block {
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(8px);
    border-radius: 50px;
    padding: 7px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1.5px solid rgba(255,255,255,0.12);
  }

  .hud-score {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(16px, 3vw, 22px);
    color: #ffd060;
    letter-spacing: 1px;
  }

  .hud-lives {
    font-size: clamp(14px, 2.5vw, 20px);
    letter-spacing: 2px;
  }

  .hud-level {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(13px, 2vw, 18px);
    color: #a8e6cf;
    letter-spacing: 1px;
  }

  /* Pantalla de inicio / pausa / game over */
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    background: rgba(5, 5, 20, 0.85);
    backdrop-filter: blur(6px);
    transition: opacity 0.4s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }

  .overlay-card {
    background: linear-gradient(145deg, #1e1b4b, #312e81);
    border: 2px solid rgba(167,139,250,0.4);
    border-radius: 32px;
    padding: clamp(24px, 5vw, 48px) clamp(30px, 6vw, 60px);
    text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 60px rgba(139,92,246,0.2);
    max-width: min(480px, 90vw);
  }

  .overlay-title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(28px, 7vw, 52px);
    color: #ffd060;
    text-shadow: 0 0 30px rgba(255,208,96,0.5);
    margin-bottom: 8px;
    letter-spacing: 2px;
  }

  .overlay-sub {
    font-size: clamp(13px, 2.5vw, 17px);
    color: rgba(255,255,255,0.65);
    margin-bottom: 28px;
    line-height: 1.5;
  }

  .overlay-score-display {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(20px, 4vw, 32px);
    color: #a78bfa;
    margin-bottom: 24px;
  }

  .btn {
    display: inline-block;
    font-family: 'Fredoka One', cursive;
    font-size: clamp(16px, 3vw, 22px);
    letter-spacing: 1px;
    padding: 14px 40px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    pointer-events: all;
  }

  .btn-play {
    background: linear-gradient(135deg, #f59e0b, #fbbf24);
    color: #1c1917;
    box-shadow: 0 8px 30px rgba(251,191,36,0.4);
  }
  .btn-play:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 14px 40px rgba(251,191,36,0.55); }
  .btn-play:active { transform: scale(0.97); }

  /* Controles táctiles */
  #touchControls {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 160px;
    z-index: 10;
    pointer-events: none;
    display: none;
  }
  #touchControls.active { display: flex; pointer-events: all; }

  .touch-dpad {
    position: absolute;
    bottom: 20px;
    left: 20px;
    display: flex;
    gap: 8px;
  }

  .touch-btn {
    width: 64px;
    height: 64px;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 16px;
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    color: white;
    cursor: pointer;
    transition: background 0.1s, transform 0.1s;
    pointer-events: all;
  }
  .touch-btn:active, .touch-btn.pressed {
    background: rgba(255,255,255,0.35);
    transform: scale(0.93);
  }

  .touch-jump {
    position: absolute;
    bottom: 20px;
    right: 20px;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: rgba(251,191,36,0.25);
    border: 2px solid rgba(251,191,36,0.5);
    font-size: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Notificación de puntos flotantes */
  .float-text {
    position: absolute;
    font-family: 'Fredoka One', cursive;
    font-size: 22px;
    color: #ffd060;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    pointer-events: none;
    z-index: 30;
    animation: floatUp 0.9s ease-out forwards;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
  }

  /* Shake del HUD al recibir daño */
  @keyframes hudShake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  .hud-shake { animation: hudShake 0.35s ease; }

  /* Bonus vida */
  @keyframes lifeGain {
    0% { transform: scale(1); }
    50% { transform: scale(1.4); }
    100% { transform: scale(1); }
  }
  .life-gain { animation: lifeGain 0.4s ease; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- HUD siempre visible -->
<div id="hud">
  <div class="hud-block">
    <span style="font-size:20px">🧶</span>
    <span class="hud-score" id="scoreDisplay">0</span>
  </div>
  <div class="hud-block hud-level" id="levelDisplay">Nivel 1</div>
  <div class="hud-block">
    <span class="hud-lives" id="livesDisplay">💖💖💖</span>
  </div>
</div>

<!-- Overlay inicio / game over -->
<div id="overlay">
  <div class="overlay-card">
    <div style="font-size:clamp(48px,10vw,72px);margin-bottom:6px">🐱</div>
    <div class="overlay-title" id="overlayTitle">Mishu's Yarn Hunt</div>
    <div class="overlay-sub" id="overlaySub">
      Ayuda a Mishu a atrapar todos los ovillos mágicos.<br>
      ← → para moverse &nbsp;·&nbsp; ↑ / Espacio para saltar
    </div>
    <div class="overlay-score-display" id="overlayScore" style="display:none"></div>
    <button class="btn btn-play" id="playBtn" onclick="startGame()">¡Jugar! 🐾</button>
  </div>
</div>

<!-- Controles táctiles -->
<div id="touchControls">
  <div class="touch-dpad">
    <div class="touch-btn" id="btnLeft">◀</div>
    <div class="touch-btn" id="btnRight">▶</div>
  </div>
  <div class="touch-btn touch-jump" id="btnJump">⬆</div>
</div>

<script>
// ============================================================
//  MISHU'S YARN HUNT — Versión Pro
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let W, H, SCALE;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  SCALE = Math.min(W / 600, H / 400);
  if (!gameRunning) return;
  rebuildLevel();
}
window.addEventListener('resize', resize);

// ---- Estado global ----
let score = 0, lives = 3, level = 1, gameRunning = false, paused = false;
let particles = [], floatingTexts = [], clouds = [], stars = [];

// Mishu
let mishu = {};
let platforms = [], hazards = [], collectibles = [];
let yarnBall = {};
let invincibleTimer = 0;
let jumpRequested = false;
let keys = { left: false, right: false };
let frameCount = 0;
let levelClearTimer = 0;
let levelClearing = false;

// Controles táctiles
const isMobile = /Mobi|Android|iPhone/i.test(navigator.userAgent);
if (isMobile) {
  document.getElementById('touchControls').classList.add('active');
}

function setupTouchControls() {
  const addBtn = (id, onDown, onUp) => {
    const el = document.getElementById(id);
    const down = (e) => { e.preventDefault(); el.classList.add('pressed'); onDown(); };
    const up = (e) => { e.preventDefault(); el.classList.remove('pressed'); if (onUp) onUp(); };
    el.addEventListener('touchstart', down, { passive: false });
    el.addEventListener('touchend', up, { passive: false });
    el.addEventListener('mousedown', down);
    el.addEventListener('mouseup', up);
  };
  addBtn('btnLeft', () => keys.left = true, () => keys.left = false);
  addBtn('btnRight', () => keys.right = true, () => keys.right = false);
  addBtn('btnJump', () => { jumpRequested = true; }, () => {});
}
setupTouchControls();

// Teclado
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') {
    e.preventDefault();
    jumpRequested = true;
  }
  if (e.key === 'r' || e.key === 'R') {
    if (!gameRunning) startGame();
  }
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});

// ============================================================
//  NIVELES
// ============================================================
function getLevelConfig(lvl) {
  const base = lvl - 1;
  return {
    yarnsToCollect: 3 + base * 2,          // ovillos para pasar de nivel
    hazardSpeed: 0.5 + base * 0.4,          // cactus móviles
    skyTop: `hsl(${200 - base * 20},70%,${75 - base * 8}%)`,
    skyBot: `hsl(${180 - base * 15},55%,${88 - base * 8}%)`,
    groundColor: `hsl(${120 - base * 15},45%,${35 - base * 4}%)`,
    platformColor: ['#ac8e5a','#7a6040','#5c4a30','#8b6914','#3d5a30'][Math.min(base,4)],
  };
}

let levelCfg = {};
let yarnsThisLevel = 0;

function rebuildLevel() {
  levelCfg = getLevelConfig(level);
  const s = SCALE;
  // Mishu (solo si no existe o reiniciando)
  if (!mishu.x) {
    mishu = {
      x: 60 * s, y: (H - 130 * s),
      vx: 0, vy: 0,
      w: 28 * s, h: 28 * s,
      grounded: false, facingRight: true,
      jumpPower: -10 * s,
      gravity: 0.52 * s,
      maxSpeed: 4.5 * s,
      friction: 0.88,
      accel: 0.6 * s
    };
  }

  // Plataformas escaladas
  const ph = 14 * s;
  const raw = [
    [0.03, 0.87, 0.18, ph],
    [0.22, 0.82, 0.15, ph],
    [0.40, 0.80, 0.14, ph],
    [0.59, 0.85, 0.15, ph],
    [0.78, 0.88, 0.18, ph],
    [0.03, 0.70, 0.13, ph],
    [0.32, 0.65, 0.13, ph],
    [0.58, 0.68, 0.13, ph],
    [0.80, 0.70, 0.12, ph],
    [0.18, 0.52, 0.12, ph],
    [0.48, 0.50, 0.12, ph],
    [0.72, 0.54, 0.11, ph],
    [0.32, 0.36, 0.11, ph],
    [0.60, 0.38, 0.10, ph],
  ];
  platforms = raw.map(([rx, ry, rw, rh]) => ({
    x: rx * W, y: ry * H, w: rw * W, h: rh
  }));
  // Suelo invisible para atrapar caídas
  platforms.push({ x: 0, y: H + 10, w: W, h: 20 });

  // Peligros
  const hh = 16 * s;
  const rawH = [
    [0.185, 0.795],
    [0.62, 0.835],
    [0.35, 0.635],
    [0.82, 0.685],
    [0.50, 0.475],
    [0.74, 0.520],
  ];
  hazards = rawH.map(([rx, ry], i) => ({
    x: rx * W, y: ry * H - hh,
    w: 14 * s, h: hh,
    baseX: rx * W, dir: (i % 2 === 0) ? 1 : -1,
    speed: levelCfg.hazardSpeed * s * (0.8 + i * 0.15),
    range: 18 * s
  }));

  respawnYarn();
  buildStars();
  buildClouds();
}

function buildStars() {
  stars = Array.from({ length: 60 }, () => ({
    x: Math.random() * W,
    y: Math.random() * H * 0.55,
    r: Math.random() * 2 + 0.5,
    alpha: Math.random() * 0.7 + 0.3,
    twinkle: Math.random() * Math.PI * 2
  }));
}

function buildClouds() {
  clouds = Array.from({ length: 5 }, (_, i) => ({
    x: (i / 5) * W + Math.random() * 100,
    y: (0.05 + Math.random() * 0.3) * H,
    size: (30 + Math.random() * 40) * SCALE,
    speed: (0.2 + Math.random() * 0.3) * SCALE
  }));
}

function respawnYarn() {
  const safePlats = platforms.filter(p => p.y < H * 0.95);
  const p = safePlats[Math.floor(Math.random() * safePlats.length)];
  yarnBall = {
    x: p.x + p.w / 2,
    y: p.y - 10 * SCALE,
    r: 9 * SCALE,
    collected: false,
    bobOffset: Math.random() * Math.PI * 2,
    glow: 0
  };
}

// ============================================================
//  PARTÍCULAS
// ============================================================
function spawnParticles(x, y, color, n = 12) {
  for (let i = 0; i < n; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = (1.5 + Math.random() * 3) * SCALE;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2 * SCALE,
      r: (2 + Math.random() * 4) * SCALE,
      color,
      life: 1, decay: 0.04 + Math.random() * 0.04
    });
  }
}

function spawnStarBurst(x, y) {
  const colors = ['#ffd060', '#ff9eb5', '#a8e6cf', '#ffb347', '#c3b1e1'];
  spawnParticles(x, y, colors[Math.floor(Math.random() * colors.length)], 20);
}

function spawnHurtParticles(x, y) {
  spawnParticles(x, y, '#ff4444', 8);
}

// ============================================================
//  LÓGICA DEL JUEGO
// ============================================================
function updateGame() {
  frameCount++;

  // Nubes
  for (const c of clouds) {
    c.x += c.speed;
    if (c.x - c.size * 2 > W) c.x = -c.size * 2;
  }

  // Estrellas (twinkle)
  for (const s of stars) {
    s.twinkle += 0.05;
    s.alpha = 0.3 + 0.4 * Math.abs(Math.sin(s.twinkle));
  }

  if (levelClearing) {
    levelClearTimer--;
    if (levelClearTimer <= 0) nextLevel();
    return;
  }

  // Peligros móviles
  for (const h of hazards) {
    h.x += h.speed * h.dir;
    if (Math.abs(h.x - h.baseX) > h.range) h.dir *= -1;
  }

  // Movimiento Mishu
  if (keys.left) {
    mishu.vx = Math.max(-mishu.maxSpeed, mishu.vx - mishu.accel);
    mishu.facingRight = false;
  }
  if (keys.right) {
    mishu.vx = Math.min(mishu.maxSpeed, mishu.vx + mishu.accel);
    mishu.facingRight = true;
  }
  if (!keys.left && !keys.right) {
    mishu.vx *= mishu.friction;
    if (Math.abs(mishu.vx) < 0.1) mishu.vx = 0;
  }

  mishu.vy += mishu.gravity;
  mishu.x += mishu.vx;
  mishu.y += mishu.vy;

  // Límites horizontales
  if (mishu.x < 0) { mishu.x = 0; mishu.vx = 0; }
  if (mishu.x + mishu.w > W) { mishu.x = W - mishu.w; mishu.vx = 0; }

  // Colisiones plataformas
  mishu.grounded = false;
  for (const p of platforms) {
    const prevBottom = mishu.y + mishu.h - mishu.vy;
    if (mishu.vy >= 0 &&
        mishu.x + mishu.w > p.x + 4 &&
        mishu.x < p.x + p.w - 4 &&
        prevBottom <= p.y + 2 &&
        mishu.y + mishu.h >= p.y) {
      mishu.y = p.y - mishu.h;
      mishu.vy = 0;
      mishu.grounded = true;
    }
  }

  // Salto
  if (jumpRequested && mishu.grounded) {
    mishu.vy = mishu.jumpPower;
    mishu.grounded = false;
    jumpRequested = false;
    spawnParticles(mishu.x + mishu.w / 2, mishu.y + mishu.h, '#c3b1e1', 6);
  }
  jumpRequested = false;

  // Caída del mapa
  if (mishu.y > H + 50) {
    hurtMishu();
    resetMishuPos();
  }

  // Colisión peligros
  if (invincibleTimer <= 0) {
    for (const h of hazards) {
      if (rectsOverlap(mishu, { x: h.x, y: h.y, w: h.w, h: h.h })) {
        hurtMishu();
        mishu.vx = mishu.facingRight ? -4 * SCALE : 4 * SCALE;
        mishu.vy = -5 * SCALE;
        break;
      }
    }
  }
  if (invincibleTimer > 0) invincibleTimer--;

  // Ovillo bobbing
  yarnBall.bobOffset += 0.07;
  yarnBall.glow = 0.6 + 0.4 * Math.sin(frameCount * 0.08);

  // Colisión ovillo
  if (!yarnBall.collected) {
    const dy = mishu.y + mishu.h / 2 - yarnBall.y;
    const dx = mishu.x + mishu.w / 2 - yarnBall.x;
    if (Math.sqrt(dx * dx + dy * dy) < yarnBall.r + mishu.w / 2 - 4) {
      yarnBall.collected = true;
      score++;
      yarnsThisLevel++;
      updateHUD();
      spawnStarBurst(yarnBall.x, yarnBall.y);
      showFloatText(yarnBall.x, yarnBall.y, '+1 🧶');
      if (score % 8 === 0 && lives < 5) {
        lives++;
        updateHUD(true);
        showFloatText(mishu.x, mishu.y - 20 * SCALE, '💖 +Vida');
      }
      // Avanzar nivel
      if (yarnsThisLevel >= levelCfg.yarnsToCollect) {
        levelClearing = true;
        levelClearTimer = 90;
        showFloatText(W / 2, H / 2, `🌟 ¡Nivel ${level} completado!`);
      } else {
        setTimeout(respawnYarn, 400);
      }
    }
  }

  // Partículas
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15 * SCALE;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function rectsOverlap(a, b) {
  return a.x + a.w > b.x + 4 && a.x < b.x + b.w - 4 &&
         a.y + a.h > b.y + 4 && a.y < b.y + b.h - 4;
}

function hurtMishu() {
  lives--;
  invincibleTimer = 70;
  spawnHurtParticles(mishu.x + mishu.w / 2, mishu.y + mishu.h / 2);
  updateHUD();
  document.getElementById('hud').classList.add('hud-shake');
  setTimeout(() => document.getElementById('hud').classList.remove('hud-shake'), 400);
  if (lives <= 0) {
    lives = 0;
    endGame();
  }
}

function resetMishuPos() {
  mishu.x = 60 * SCALE;
  mishu.y = H - 130 * SCALE;
  mishu.vx = 0; mishu.vy = 0;
}

function nextLevel() {
  level++;
  yarnsThisLevel = 0;
  levelClearing = false;
  levelCfg = getLevelConfig(level);
  mishu.x = 0; // force rebuild
  rebuildLevel();
  mishu.x = 60 * SCALE;
  mishu.y = H - 130 * SCALE;
  mishu.vx = 0; mishu.vy = 0;
  updateHUD();
}

// ============================================================
//  DIBUJO
// ============================================================
function draw() {
  ctx.clearRect(0, 0, W, H);
  drawBackground();
  drawPlatforms();
  drawHazards();
  if (!yarnBall.collected) drawYarn();
  drawParticles();
  drawMishu();
  drawLevelProgress();
}

function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, levelCfg.skyTop || '#b8def5');
  grad.addColorStop(0.6, levelCfg.skyBot || '#e4f0fa');
  grad.addColorStop(1, levelCfg.groundColor || '#5a8a3a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Estrellas (visible en niveles altos)
  if (level >= 3) {
    for (const s of stars) {
      ctx.globalAlpha = s.alpha * ((level - 2) / 3);
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Nubes
  for (const c of clouds) {
    ctx.globalAlpha = 0.8;
    drawCloudShape(c.x, c.y, c.size);
  }
  ctx.globalAlpha = 1;

  // Suelo decorativo
  const gy = H - 14 * SCALE;
  const gGrad = ctx.createLinearGradient(0, gy, 0, H);
  gGrad.addColorStop(0, levelCfg.platformColor || '#ac8e5a');
  gGrad.addColorStop(1, 'rgba(0,0,0,0.3)');
  ctx.fillStyle = gGrad;
  ctx.fillRect(0, gy, W, 14 * SCALE);

  // Arboles / decoración de fondo
  drawTrees();
}

function drawCloudShape(x, y, s) {
  ctx.fillStyle = 'rgba(255,252,235,0.9)';
  ctx.beginPath();
  ctx.ellipse(x, y, s, s * 0.6, 0, 0, Math.PI * 2);
  ctx.ellipse(x + s * 0.65, y - s * 0.2, s * 0.75, s * 0.55, 0, 0, Math.PI * 2);
  ctx.ellipse(x - s * 0.55, y - s * 0.15, s * 0.7, s * 0.5, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawTrees() {
  const positions = [0.05, 0.88, 0.3, 0.95, 0.55, 0.92, 0.75, 0.89];
  for (let i = 0; i < positions.length; i += 2) {
    const tx = positions[i] * W;
    const ty = positions[i + 1] * H;
    const ts = 25 * SCALE;
    ctx.fillStyle = '#5c4020';
    ctx.fillRect(tx - 4 * SCALE, ty - ts * 2, 8 * SCALE, ts * 2);
    ctx.fillStyle = '#3d7a28';
    ctx.beginPath();
    ctx.ellipse(tx, ty - ts * 2.2, ts, ts * 1.4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2d6018';
    ctx.beginPath();
    ctx.ellipse(tx + ts * 0.3, ty - ts * 2.6, ts * 0.75, ts * 1.1, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawPlatforms() {
  for (const p of platforms) {
    if (p.y > H) continue; // suelo invisible
    // Sombra
    ctx.shadowBlur = 8 * SCALE;
    ctx.shadowColor = 'rgba(0,0,0,0.35)';

    // Cuerpo
    const grad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
    grad.addColorStop(0, levelCfg.platformColor || '#ac8e5a');
    grad.addColorStop(1, shadeColor(levelCfg.platformColor || '#ac8e5a', -30));
    ctx.fillStyle = grad;
    roundRect(p.x, p.y, p.w, p.h, 4 * SCALE);

    ctx.shadowBlur = 0;
    // Borde top brillante
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.fillRect(p.x + 3 * SCALE, p.y, p.w - 6 * SCALE, 3 * SCALE);
    // Vetas
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    const veins = Math.floor(p.w / (20 * SCALE));
    for (let i = 0; i < veins; i++) {
      ctx.fillRect(p.x + 6 * SCALE + i * 18 * SCALE, p.y + 3 * SCALE, 3 * SCALE, p.h - 5 * SCALE);
    }
    // Musgo
    ctx.fillStyle = '#4a9a28';
    ctx.fillRect(p.x + 2 * SCALE, p.y - 2 * SCALE, 8 * SCALE, 3 * SCALE);
    ctx.fillRect(p.x + p.w * 0.5, p.y - 1 * SCALE, 6 * SCALE, 3 * SCALE);
  }
}

function drawHazards() {
  for (const h of hazards) {
    // base tierra
    ctx.fillStyle = '#6f4f2e';
    ctx.beginPath();
    ctx.ellipse(h.x + h.w / 2, h.y + h.h + 2 * SCALE, 7 * SCALE, 4 * SCALE, 0, 0, Math.PI * 2);
    ctx.fill();
    // tallo
    ctx.fillStyle = '#5a9e34';
    ctx.fillRect(h.x + 3 * SCALE, h.y, 5 * SCALE, h.h);
    ctx.fillRect(h.x + h.w - 8 * SCALE, h.y, 5 * SCALE, h.h * 0.9);
    // punta superior
    ctx.fillStyle = '#3d7a1e';
    ctx.beginPath();
    ctx.moveTo(h.x + 2 * SCALE, h.y);
    ctx.lineTo(h.x + h.w / 2, h.y - 8 * SCALE);
    ctx.lineTo(h.x + h.w - 2 * SCALE, h.y);
    ctx.fill();
    // espinas brillantes
    ctx.fillStyle = '#c6f135';
    for (let i = 0; i < 3; i++) {
      ctx.fillRect(h.x + 1 * SCALE + i * 5 * SCALE, h.y + 3 * SCALE + i * 4 * SCALE, 2 * SCALE, 2 * SCALE);
    }
  }
}

function drawMishu() {
  const x = mishu.x, y = mishu.y;
  const s = SCALE;

  if (invincibleTimer > 0 && Math.floor(frameCount / 4) % 2 === 0) {
    ctx.globalAlpha = 0.45;
  }

  ctx.save();
  if (!mishu.facingRight) {
    ctx.translate(x + mishu.w, 0);
    ctx.scale(-1, 1);
    ctx.translate(-x, 0);
  }

  // Cola rizada
  ctx.beginPath();
  ctx.moveTo(x + mishu.w - 2 * s, y + mishu.h - 10 * s);
  ctx.quadraticCurveTo(x + mishu.w + 9 * s, y + mishu.h - 22 * s, x + mishu.w + 4 * s, y + mishu.h - 5 * s);
  ctx.lineWidth = 6 * s;
  ctx.strokeStyle = '#e8832e';
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.lineWidth = 3 * s;
  ctx.strokeStyle = '#f0a050';
  ctx.stroke();

  // Sombra mishu
  ctx.shadowBlur = 10 * s;
  ctx.shadowColor = 'rgba(0,0,0,0.3)';

  // Cuerpo principal
  ctx.fillStyle = '#e8832e';
  ctx.beginPath();
  ctx.ellipse(x + mishu.w / 2, y + mishu.h / 2 + 2 * s, mishu.w / 2 - 1, mishu.h / 2.2, 0, 0, Math.PI * 2);
  ctx.fill();

  // Rayas atigradas
  ctx.fillStyle = '#bd5710';
  for (let i = 0; i < 3; i++) {
    ctx.fillRect(x + 5 * s + i * 6 * s, y + 12 * s, 3 * s, 8 * s);
  }

  // Cabeza
  ctx.fillStyle = '#f49b42';
  ctx.beginPath();
  ctx.ellipse(x + mishu.w / 2, y - 1 * s, 13 * s, 13 * s, 0, 0, Math.PI * 2);
  ctx.fill();

  // Orejas
  ctx.fillStyle = '#d9772c';
  [[x + 4 * s, y - 8 * s, x + 11 * s, y - 17 * s, x + 16 * s, y - 9 * s],
   [x + mishu.w - 4 * s, y - 8 * s, x + mishu.w - 11 * s, y - 17 * s, x + mishu.w - 16 * s, y - 9 * s]]
    .forEach(([ax, ay, bx, by, cx, cy]) => {
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(cx, cy); ctx.closePath(); ctx.fill();
    });
  ctx.fillStyle = '#ffb8a0';
  ctx.beginPath(); ctx.moveTo(x + 6 * s, y - 9 * s); ctx.lineTo(x + 11 * s, y - 15 * s); ctx.lineTo(x + 14 * s, y - 10 * s); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + mishu.w - 6 * s, y - 9 * s); ctx.lineTo(x + mishu.w - 11 * s, y - 15 * s); ctx.lineTo(x + mishu.w - 14 * s, y - 10 * s); ctx.closePath(); ctx.fill();

  // Ojos
  ctx.shadowBlur = 0;
  [x + 8 * s, x + mishu.w - 9 * s].forEach((ex) => {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(ex, y - 2 * s, 4.5 * s, 4 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2d6b2f';
    ctx.beginPath(); ctx.arc(ex, y - 2 * s, 2.5 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(ex - 0.5 * s, y - 2.5 * s, 1.2 * s, 0, Math.PI * 2); ctx.fill();
    // reflejo
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(ex + 1 * s, y - 3.5 * s, 0.8 * s, 0, Math.PI * 2); ctx.fill();
  });

  // Nariz
  ctx.fillStyle = '#d45070';
  ctx.beginPath();
  ctx.moveTo(x + mishu.w / 2 - 2 * s, y + 3 * s);
  ctx.lineTo(x + mishu.w / 2 + 2 * s, y + 3 * s);
  ctx.lineTo(x + mishu.w / 2, y + 6 * s);
  ctx.fill();

  // Bigotes
  ctx.strokeStyle = 'rgba(60,40,20,0.6)';
  ctx.lineWidth = 1.2 * s;
  [[x + 3 * s, y + 2 * s, x - 8 * s, y], [x + 2 * s, y + 5 * s, x - 7 * s, y + 4 * s],
   [x + mishu.w - 3 * s, y + 2 * s, x + mishu.w + 8 * s, y],
   [x + mishu.w - 2 * s, y + 5 * s, x + mishu.w + 7 * s, y + 4 * s]].forEach(([ax, ay, bx, by]) => {
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
  });

  // Bandana azul
  ctx.fillStyle = '#4a8fd4';
  ctx.beginPath();
  ctx.moveTo(x + 5 * s, y + 6 * s);
  ctx.lineTo(x + mishu.w / 2, y + 12 * s);
  ctx.lineTo(x + mishu.w - 5 * s, y + 6 * s);
  ctx.fill();
  ctx.fillStyle = '#2a5fa8';
  ctx.fillRect(x + 9 * s, y + 6 * s, 7 * s, 5 * s);
  ctx.fillStyle = '#6ab0ef';
  ctx.fillRect(x + 10 * s, y + 7 * s, 5 * s, 2 * s);

  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawYarn() {
  const bx = yarnBall.x;
  const by = yarnBall.y + Math.sin(yarnBall.bobOffset) * 4 * SCALE;
  const r = yarnBall.r;

  // Glow animado
  ctx.shadowBlur = 15 * SCALE * yarnBall.glow;
  ctx.shadowColor = '#ff80ab';

  ctx.fillStyle = '#ffb7c5';
  ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.fill();

  ctx.shadowBlur = 0;

  ctx.fillStyle = '#f06a8f';
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2 + frameCount * 0.04;
    ctx.beginPath();
    ctx.ellipse(bx + Math.cos(a) * r * 0.5, by + Math.sin(a) * r * 0.5, r * 0.55, r * 0.35, a, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#e1486b';
  ctx.beginPath(); ctx.arc(bx + 2 * SCALE, by - r * 0.3, r * 0.28, 0, Math.PI * 2); ctx.fill();

  // Estrellitas alrededor
  ctx.fillStyle = 'rgba(255,208,96,0.85)';
  for (let i = 0; i < 3; i++) {
    const a = (i / 3) * Math.PI * 2 + frameCount * 0.06;
    const sx = bx + Math.cos(a) * (r + 8 * SCALE);
    const sy = by + Math.sin(a) * (r + 8 * SCALE);
    drawStar(sx, sy, 3 * SCALE);
  }
}

function drawStar(x, y, r) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(frameCount * 0.08);
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = (i * 2 * Math.PI) / 5 - Math.PI / 2;
    const ax = Math.cos(a) * r, ay = Math.sin(a) * r;
    const bx2 = Math.cos(a + Math.PI / 5) * r * 0.4;
    const by2 = Math.sin(a + Math.PI / 5) * r * 0.4;
    i === 0 ? ctx.moveTo(ax, ay) : ctx.lineTo(ax, ay);
    ctx.lineTo(bx2, by2);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawLevelProgress() {
  // Barra de progreso nivel
  const total = levelCfg.yarnsToCollect;
  const done = Math.min(yarnsThisLevel, total);
  const barW = 120 * SCALE;
  const barH = 8 * SCALE;
  const bx = W / 2 - barW / 2;
  const by = H - 22 * SCALE;

  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  roundRect(bx, by, barW, barH, 4 * SCALE);
  ctx.fillStyle = '#ffd060';
  roundRect(bx, by, barW * (done / total), barH, 4 * SCALE);

  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = `bold ${10 * SCALE}px 'Nunito', sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(`${done}/${total} 🧶`, W / 2, by - 4 * SCALE);
  ctx.textAlign = 'left';
}

// ============================================================
//  UI & HUD
// ============================================================
function updateHUD(lifeGainEffect = false) {
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('levelDisplay').textContent = `Nivel ${level}`;
  const hearts = '💖'.repeat(lives) + '🖤'.repeat(Math.max(0, 3 - lives));
  const livesEl = document.getElementById('livesDisplay');
  livesEl.textContent = hearts;
  if (lifeGainEffect) {
    livesEl.classList.add('life-gain');
    setTimeout(() => livesEl.classList.remove('life-gain'), 400);
  }
}

function showFloatText(x, y, text) {
  const el = document.createElement('div');
  el.className = 'float-text';
  el.textContent = text;
  el.style.left = Math.min(Math.max(x - 40, 10), W - 120) + 'px';
  el.style.top = Math.min(Math.max(y - 20, 10), H - 50) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 950);
}

// ============================================================
//  INICIO / FIN
// ============================================================
function startGame() {
  score = 0; lives = 3; level = 1; yarnsThisLevel = 0;
  frameCount = 0; levelClearing = false;
  particles = []; floatingTexts = [];
  mishu = {};
  gameRunning = true;
  resize();
  mishu.x = 60 * SCALE;
  mishu.y = H - 130 * SCALE;
  mishu.vx = 0; mishu.vy = 0;
  updateHUD();
  document.getElementById('overlay').classList.add('hidden');
  loop();
}

function endGame() {
  gameRunning = false;
  document.getElementById('overlayTitle').textContent = '¡Juego Terminado! 💔';
  document.getElementById('overlaySub').textContent = 'Mishu se quedó sin vidas...';
  const sc = document.getElementById('overlayScore');
  sc.style.display = 'block';
  sc.textContent = `🧶 Ovillos atrapados: ${score}  ·  Nivel alcanzado: ${level}`;
  document.getElementById('playBtn').textContent = '¡Volver a Jugar! 🐱';
  document.getElementById('overlay').classList.remove('hidden');
}

// ============================================================
//  LOOP PRINCIPAL
// ============================================================
function loop() {
  if (!gameRunning) return;
  updateGame();
  draw();
  requestAnimationFrame(loop);
}

// ============================================================
//  HELPERS
// ============================================================
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  ctx.fill();
}

function shadeColor(hex, amt) {
  let n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, (n >> 16) + amt));
  const g = Math.max(0, Math.min(255, ((n >> 8) & 0xff) + amt));
  const b = Math.max(0, Math.min(255, (n & 0xff) + amt));
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}

// Init
resize();
</script>
