<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🐱🚀 Maat Astronauta · Misión Estable</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: #020818;
      overflow: hidden;
      font-family: 'Exo 2', sans-serif;
      width: 100vw;
      height: 100vh;
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* HUD */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }
    .hud-pill {
      background: rgba(2,8,24,0.7);
      border: 1px solid rgba(34,211,238,0.3);
      border-radius: 50px;
      padding: 7px 18px;
      backdrop-filter: blur(10px);
    }
    .hud-score { font-family: 'Orbitron', monospace; color: #ffe97a; }
    .hud-level { font-family: 'Orbitron', monospace; color: #22d3ee; }
    .hud-lives { letter-spacing: 3px; }

    /* Botón EXIT rojo (siempre visible) */
    #exitBtn {
      position: absolute;
      top: 14px;
      right: 80px;
      width: 50px;
      height: 50px;
      background: #dc2626;
      border: 2px solid rgba(255,255,200,0.8);
      border-radius: 50%;
      font-family: 'Orbitron', monospace;
      font-weight: bold;
      font-size: 13px;
      color: white;
      text-align: center;
      line-height: 46px;
      cursor: pointer;
      z-index: 25;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 12px rgba(220,38,38,0.6);
      transition: 0.2s;
    }
    #exitBtn:hover { transform: scale(1.08); background: #ef4444; }

    /* Botón música */
    #musicBtn {
      position: absolute;
      top: 14px;
      right: 18px;
      width: 42px;
      height: 42px;
      background: rgba(2,8,24,0.7);
      border: 1px solid rgba(34,211,238,0.3);
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      z-index: 25;
      backdrop-filter: blur(8px);
      color: white;
    }

    /* Overlay (presentación estilo imagen) */
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(2,8,24,0.88);
      backdrop-filter: blur(8px);
      transition: opacity 0.5s;
    }
    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .overlay-card {
      background: linear-gradient(160deg, rgba(10,22,40,0.97), rgba(20,10,50,0.97));
      border: 1px solid rgba(34,211,238,0.4);
      border-radius: 32px;
      padding: clamp(28px, 5vw, 52px) clamp(32px, 6vw, 64px);
      text-align: center;
      max-width: min(520px, 92vw);
    }
    .overlay-icon { font-size: clamp(52px, 10vw, 80px); animation: floatIcon 3s infinite; }
    @keyframes floatIcon { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    .overlay-title {
      font-family: 'Orbitron', monospace;
      font-size: clamp(22px, 5vw, 42px);
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 20px #22d3ee;
    }
    .overlay-sub {
      font-size: clamp(12px, 2vw, 15px);
      color: rgba(200,216,240,0.7);
      margin: 20px 0 28px;
    }
    .btn-launch {
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      padding: 12px 40px;
      border-radius: 60px;
      border: none;
      background: linear-gradient(135deg, #22d3ee, #7c3aed);
      color: white;
      cursor: pointer;
    }
    .btn-launch:hover { transform: scale(1.05); }

    /* Controles táctiles */
    #touchControls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 170px;
      z-index: 10;
      pointer-events: none;
      display: none;
    }
    #touchControls.active { display: flex; pointer-events: all; }
    .t-dpad { position: absolute; bottom: 22px; left: 18px; display: flex; gap: 10px; }
    .t-btn {
      width: 66px;
      height: 66px;
      background: rgba(34,211,238,0.1);
      border: 1.5px solid rgba(34,211,238,0.4);
      border-radius: 16px;
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #22d3ee;
      cursor: pointer;
    }
    .t-jump {
      position: absolute;
      bottom: 22px;
      right: 18px;
      width: 82px;
      height: 82px;
      border-radius: 50%;
    }
    .float-text {
      position: absolute;
      font-family: 'Orbitron', monospace;
      color: #ffe97a;
      text-shadow: 0 0 10px #ffb347;
      pointer-events: none;
      z-index: 30;
      animation: floatUp 1s forwards;
      white-space: nowrap;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-70px) scale(1.2); }
    }
    .hud-shake { animation: shake 0.38s ease; }
    @keyframes shake {
      0%,100%{ transform: translateX(0); }
      20%{ transform: translateX(-7px); }
      40%{ transform: translateX(7px); }
      60%{ transform: translateX(-4px); }
      80%{ transform: translateX(4px); }
    }
  </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="hud">
  <div class="hud-pill"><span>🧶</span><span class="hud-score" id="scoreDisplay">000</span></div>
  <div class="hud-pill hud-level" id="levelDisplay">ÓRBITA 1</div>
  <div class="hud-pill"><span class="hud-lives" id="livesDisplay">🐾🐾🐾</span></div>
</div>

<div id="exitBtn">EXIT</div>
<button id="musicBtn">🎵</button>

<div id="overlay">
  <div class="overlay-card">
    <div class="overlay-icon">🐱🚀</div>
    <div class="overlay-title">MAAT ASTRONAUTA</div>
    <div class="overlay-sub">
      ☆ Gata espacial en busca de ovillos ☆<br>
      ← → mover &nbsp;&nbsp; ↑ / espacio saltar
    </div>
    <button class="btn-launch" id="launchBtn">🚀 LANZAR MISIÓN</button>
  </div>
</div>

<div id="touchControls">
  <div class="t-dpad"><div class="t-btn" id="btnLeft">◀</div><div class="t-btn" id="btnRight">▶</div></div>
  <div class="t-btn t-jump" id="btnJump">↑</div>
</div>

<script>
  (function(){
    // ---------- CANVAS ----------
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let W, H, S;

    // ---------- AUDIO ----------
    let audioCtx = null;
    let musicOn = false;
    let musicLoopId = null;
    let musicGain = null;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playMeow() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc1.type = 'sine';
      osc2.type = 'triangle';
      gain.gain.value = 0.2;
      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(audioCtx.destination);
      osc1.frequency.setValueAtTime(950, now);
      osc1.frequency.exponentialRampToValueAtTime(420, now + 0.28);
      osc2.frequency.setValueAtTime(820, now);
      osc2.frequency.exponentialRampToValueAtTime(380, now + 0.25);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
      osc1.start(); osc2.start();
      osc1.stop(now + 0.5); osc2.stop(now + 0.5);
    }

    function playSFX(type) {
      if (!audioCtx) return;
      if (type === 'meow') { playMeow(); return; }
      if (type === 'jump') {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = 330; o.frequency.setTargetAtTime(660, audioCtx.currentTime, 0.08);
        g.gain.value = 0.07; g.gain.setTargetAtTime(0, audioCtx.currentTime + 0.05, 0.06);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + 0.2);
      } else if (type === 'hurt') {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sawtooth'; o.frequency.value = 220; o.frequency.setTargetAtTime(55, audioCtx.currentTime, 0.15);
        g.gain.value = 0.15; g.gain.setTargetAtTime(0, audioCtx.currentTime + 0.1, 0.1);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + 0.4);
      } else if (type === 'levelup') {
        [523,659,784,1047].forEach((f,i) => {
          const o = audioCtx.createOscillator(), g = audioCtx.createGain();
          o.type = 'triangle'; o.frequency.value = f;
          g.gain.value = 0.1; g.gain.setTargetAtTime(0, audioCtx.currentTime + 0.15 + i*0.1, 0.08);
          o.connect(g); g.connect(audioCtx.destination);
          o.start(audioCtx.currentTime + i * 0.12);
          o.stop(audioCtx.currentTime + 0.5 + i * 0.12);
        });
      }
    }

    function startMusic() {
      if (!audioCtx || musicLoopId) return;
      musicGain = audioCtx.createGain();
      musicGain.gain.value = 0.3;
      musicGain.connect(audioCtx.destination);
      const playChord = () => {
        if (!musicOn) return;
        const now = audioCtx.currentTime;
        [110, 138.6, 164.8].forEach(f => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = 'triangle'; o.frequency.value = f;
          g.gain.value = 0.05; g.gain.setTargetAtTime(0, now+3, 1);
          o.connect(g); g.connect(musicGain);
          o.start(); o.stop(now+3);
        });
      };
      playChord();
      musicLoopId = setInterval(playChord, 5000);
    }

    function stopMusic() {
      if (musicLoopId) clearInterval(musicLoopId);
      musicLoopId = null;
      if (musicGain) {
        musicGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.2);
        setTimeout(() => { if(musicGain) musicGain.disconnect(); }, 500);
      }
    }

    function toggleMusic() {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      musicOn = !musicOn;
      document.getElementById('musicBtn').textContent = musicOn ? '🔊' : '🔇';
      if (musicOn) startMusic();
      else stopMusic();
    }

    // ---------- ESTADO DEL JUEGO ----------
    let gameRunning = false;
    let animationId = null;
    let score = 0, lives = 3, level = 1;
    let yarnsThisLevel = 0, levelCfg = {};
    let particles = [];
    let platforms = [];
    let hazards = [];
    let yarnBall = null;
    let maat = null;
    let invincibleTimer = 0;
    let jumpRequested = false;
    let keys = { left: false, right: false };
    let frameCount = 0;
    let levelClearing = false;
    let levelClearTimer = 0;
    let respawnTimeout = null;

    const MAX_PARTICLES = 150;

    function getLevelCfg(lvl) {
      const b = lvl - 1;
      return { yarnsNeeded: 4 + b * 2, orbitLabel: ['ÓRBITA 1', 'LUNA', 'ASTEROIDE', 'NEBULOSA', 'ABISMO'][Math.min(b, 4)] };
    }

    function buildLevel() {
      levelCfg = getLevelCfg(level);
      const ph = 13 * S;
      const rawPlatforms = [
        [0.02,0.88,0.20,ph],[0.25,0.83,0.17,ph],[0.46,0.88,0.18,ph],[0.68,0.85,0.17,ph],[0.82,0.90,0.16,ph],
        [0.03,0.72,0.14,ph],[0.22,0.67,0.14,ph],[0.42,0.70,0.12,ph],[0.60,0.68,0.14,ph],[0.78,0.72,0.13,ph],
        [0.10,0.54,0.12,ph],[0.32,0.52,0.11,ph],[0.55,0.54,0.12,ph],[0.74,0.56,0.11,ph],
        [0.20,0.38,0.10,ph],[0.46,0.36,0.10,ph],[0.68,0.40,0.09,ph]
      ];
      platforms = rawPlatforms.map(r => ({ x: r[0]*W, y: r[1]*H, w: r[2]*W, h: r[3] }));
      platforms.push({ x:0, y:H+10, w:W, h:20 });

      const rawHazards = [[0.27,0.805],[0.50,0.855],[0.72,0.825],[0.26,0.640],[0.64,0.650],[0.34,0.490],[0.77,0.535]];
      hazards = rawHazards.map(([rx,ry],i) => ({
        x: rx*W, y: ry*H - 16*S, w: 14*S, h: 16*S,
        baseX: rx*W, dir: i%2===0 ? 1 : -1,
        speed: (0.5 + (level-1)*0.15) * S,
        range: 22*S,
        type: i % 3
      }));

      // Inicializar personaje si no existe
      if (!maat) resetMaatPos();
      respawnYarn();
    }

    function resetMaatPos() {
      maat = {
        x: 60*S, y: H*0.82, vx:0, vy:0,
        w: 30*S, h: 30*S, grounded: false, facingRight: true,
        jumpPower: -11*S, gravity: 0.55*S,
        maxSpeed: 5*S, friction: 0.87, accel: 0.7*S
      };
    }

    function respawnYarn() {
      if (respawnTimeout) clearTimeout(respawnTimeout);
      if (!gameRunning) return;
      const safe = platforms.filter(p => p.y < H*0.95);
      if (safe.length === 0) return;
      const p = safe[Math.floor(Math.random()*safe.length)];
      let cx = p.x + p.w/2, cy = p.y - 11*S;
      if (maat && Math.abs(maat.x - cx) < 40*S) cx = (cx + 100*S) % (W - 50*S);
      yarnBall = {
        x: cx, y: cy, r: 9*S, collected: false,
        bob: Math.random()*Math.PI*2, spin: 0
      };
    }

    function updateGame() {
      if (levelClearing) {
        levelClearTimer--;
        if (levelClearTimer <= 0) {
          level++;
          yarnsThisLevel = 0;
          levelClearing = false;
          buildLevel();
          resetMaatPos();
          updateHUD();
        }
        return;
      }

      // Movimiento obstáculos
      for (let h of hazards) {
        h.x += h.speed * h.dir;
        if (Math.abs(h.x - h.baseX) > h.range) h.dir *= -1;
      }

      // Movimiento Maat
      if (keys.left) { maat.vx = Math.max(-maat.maxSpeed, maat.vx - maat.accel); maat.facingRight = false; }
      if (keys.right) { maat.vx = Math.min(maat.maxSpeed, maat.vx + maat.accel); maat.facingRight = true; }
      if (!keys.left && !keys.right) maat.vx *= maat.friction;
      maat.vy += maat.gravity;
      maat.x += maat.vx;
      maat.y += maat.vy;

      // Bordes
      if (maat.x < 0) { maat.x = 0; maat.vx = 0; }
      if (maat.x + maat.w > W) { maat.x = W - maat.w; maat.vx = 0; }

      // Colisiones con plataformas
      maat.grounded = false;
      for (let p of platforms) {
        if (maat.vy >= 0 && maat.x+maat.w > p.x+4 && maat.x < p.x+p.w-4 &&
            maat.y+maat.h <= p.y+8 && maat.y+maat.h+maat.vy >= p.y) {
          maat.y = p.y - maat.h;
          maat.vy = 0;
          maat.grounded = true;
        }
      }

      // Salto
      if (jumpRequested && maat.grounded) {
        maat.vy = maat.jumpPower;
        jumpRequested = false;
        playSFX('jump');
      }
      jumpRequested = false;

      // Caída al vacío
      if (maat.y > H + 60) {
        hurtMaat();
        resetMaatPos();
      }

      // Daño por obstáculos
      if (invincibleTimer <= 0) {
        for (let h of hazards) {
          if (maat.x+maat.w > h.x+4 && maat.x < h.x+h.w-4 &&
              maat.y+maat.h > h.y+4 && maat.y < h.y+h.h-4) {
            hurtMaat();
            maat.vx = maat.facingRight ? -5*S : 5*S;
            maat.vy = -6*S;
            break;
          }
        }
      }
      if (invincibleTimer > 0) invincibleTimer--;

      // Ovillo
      if (yarnBall && !yarnBall.collected) {
        yarnBall.bob += 0.07;
        yarnBall.spin += 0.03;
        const dx = maat.x + maat.w/2 - yarnBall.x;
        const dy = maat.y + maat.h/2 - yarnBall.y;
        if (Math.hypot(dx, dy) < yarnBall.r + maat.w/2 - 4) {
          yarnBall.collected = true;
          score++;
          yarnsThisLevel++;
          updateHUD();
          for (let i=0;i<16;i++) {
            particles.push({
              x: yarnBall.x, y: yarnBall.y,
              vx: (Math.random()-0.5)*6*S, vy: (Math.random()-0.5)*6*S - 2*S,
              life: 0.8, decay: 0.03, color: ['#ffe97a','#22d3ee','#a78bfa'][Math.floor(Math.random()*3)]
            });
          }
          showFloat(yarnBall.x, yarnBall.y, '+1 🧶 ¡MIAU!');
          playSFX('meow');
          if (score % 8 === 0 && lives < 5) {
            lives++;
            updateHUD();
            showFloat(maat.x, maat.y-20*S, '❤️ +Vida');
          }
          if (yarnsThisLevel >= levelCfg.yarnsNeeded) {
            levelClearing = true;
            levelClearTimer = 100;
            playSFX('levelup');
          } else {
            if (respawnTimeout) clearTimeout(respawnTimeout);
            respawnTimeout = setTimeout(() => { if(gameRunning) respawnYarn(); }, 500);
          }
        }
      }

      // Partículas
      for (let i=particles.length-1; i>=0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2*S;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i,1);
      }
      if (particles.length > MAX_PARTICLES) particles = particles.slice(-MAX_PARTICLES);
    }

    function hurtMaat() {
      lives--;
      invincibleTimer = 75;
      for (let i=0;i<12;i++) {
        particles.push({
          x: maat.x+maat.w/2, y: maat.y+maat.h/2,
          vx: (Math.random()-0.5)*8*S, vy: (Math.random()-0.5)*6*S - 2*S,
          life: 0.6, decay: 0.04, color: ['#ef4444','#f97316'][Math.floor(Math.random()*2)]
        });
      }
      updateHUD();
      playSFX('hurt');
      document.getElementById('hud').classList.add('hud-shake');
      setTimeout(() => document.getElementById('hud').classList.remove('hud-shake'), 400);
      if (lives <= 0) endGame();
    }

    function endGame() {
      if (!gameRunning) return;
      gameRunning = false;
      if (animationId) cancelAnimationFrame(animationId);
      if (respawnTimeout) clearTimeout(respawnTimeout);
      stopMusic();
      document.getElementById('overlayTitle').innerText = '💀 MISIÓN FALLIDA';
      document.getElementById('overlaySub').innerHTML = 'Maat necesita descansar... ¿nuevo intento?';
      const overlayCard = document.querySelector('.overlay-card');
      let scoreDiv = document.getElementById('overlayScore');
      if (!scoreDiv) {
        scoreDiv = document.createElement('div');
        scoreDiv.id = 'overlayScore';
        scoreDiv.className = 'overlay-score-big';
        overlayCard.appendChild(scoreDiv);
      }
      scoreDiv.style.display = 'block';
      scoreDiv.innerText = `🧶 Ovillos: ${score}  ·  ${levelCfg.orbitLabel}`;
      document.getElementById('overlay').classList.remove('hidden');
    }

    function updateHUD() {
      document.getElementById('scoreDisplay').innerText = String(score).padStart(3,'0');
      document.getElementById('levelDisplay').innerText = levelCfg.orbitLabel || `ÓRBITA ${level}`;
      const hearts = '🐾'.repeat(lives) + '💀'.repeat(Math.max(0, 3-lives));
      document.getElementById('livesDisplay').innerText = hearts;
    }

    function showFloat(x, y, text) {
      const el = document.createElement('div');
      el.className = 'float-text';
      el.textContent = text;
      el.style.left = Math.min(Math.max(x-50, 10), W-120) + 'px';
      el.style.top = Math.min(Math.max(y-30, 10), H-80) + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1000);
    }

    // ---------- DIBUJO ----------
    function draw() {
      ctx.clearRect(0, 0, W, H);
      // Fondo espacial
      const grad = ctx.createLinearGradient(0,0,0,H);
      grad.addColorStop(0, '#03091a');
      grad.addColorStop(1, '#0c1428');
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,W,H);
      // Estrellas simples
      for (let i=0;i<200;i++) {
        ctx.fillStyle = `rgba(255,240,180,${0.3+Math.sin(Date.now()*0.001+i)*0.2})`;
        ctx.fillRect( (i*131)%W, (i*253)%H, 1, 1);
      }
      // Luna
      const mx = W*0.85, my = H*0.12, mr = 55*S;
      ctx.fillStyle = '#f4f9ff';
      ctx.shadowBlur = 20*S;
      ctx.beginPath(); ctx.arc(mx,my,mr,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(150,170,200,0.5)';
      ctx.beginPath(); ctx.arc(mx-15*S,my-8*S,12*S,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(mx+20*S,my+5*S,9*S,0,Math.PI*2); ctx.fill();
      // Suelo lunar
      const gy = H - 13*S;
      ctx.fillStyle = '#7f8c9a';
      ctx.fillRect(0,gy,W,13*S);

      // Plataformas
      for (let p of platforms) {
        if (p.y>=H) continue;
        ctx.fillStyle = '#9aaec9';
        ctx.fillRect(p.x,p.y,p.w,p.h);
        ctx.fillStyle = '#c0d0e5';
        ctx.fillRect(p.x+3,p.y-2,p.w-6,4);
      }

      // Obstáculos
      for (let h of hazards) {
        const cx = h.x+h.w/2, cy = h.y+h.h/2;
        ctx.fillStyle = h.type===0 ? '#9b7653' : (h.type===1 ? '#5f9eff' : '#e34234');
        ctx.beginPath(); ctx.ellipse(cx,cy,h.w/2,h.h/2,0,0,Math.PI*2); ctx.fill();
      }

      // Ovillo
      if (yarnBall && !yarnBall.collected) {
        const bx = yarnBall.x, by = yarnBall.y + Math.sin(yarnBall.bob)*5*S;
        ctx.fillStyle = '#c084fc';
        ctx.shadowBlur = 15;
        ctx.beginPath(); ctx.arc(bx,by,yarnBall.r,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.save(); ctx.translate(bx,by); ctx.rotate(yarnBall.spin);
        for (let i=0;i<4;i++) {
          ctx.fillStyle = ['#a855f7','#7e22ce','#d8b4fe','#9333ea'][i];
          ctx.beginPath(); ctx.ellipse(Math.cos(i*Math.PI/2)*yarnBall.r*0.4, Math.sin(i*Math.PI/2)*yarnBall.r*0.4, yarnBall.r*0.55,yarnBall.r*0.3, i*Math.PI/2,0,Math.PI*2); ctx.fill();
        }
        ctx.restore();
      }

      // Partículas
      for (let p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x,p.y,4*S*p.life,0,Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Gata Maat (con parches)
      drawMaat();

      // Barra de progreso
      const total = levelCfg.yarnsNeeded || 4;
      const done = Math.min(yarnsThisLevel, total);
      const bw = 150*S, bh = 8*S, bx = W/2-bw/2, by = H-24*S;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(bx,by,bw,bh);
      ctx.fillStyle = '#22d3ee';
      ctx.fillRect(bx,by,bw*(done/total),bh);
      ctx.fillStyle = '#e2e8f0';
      ctx.font = `${9*S}px Orbitron`;
      ctx.textAlign = 'center';
      ctx.fillText(`${done}/${total} 🧶`, W/2, by-6);
      ctx.textAlign = 'left';
    }

    function drawMaat() {
      const x = maat.x, y = maat.y, s = S;
      if (invincibleTimer > 0 && Math.floor(Date.now()/50)%2 === 0) ctx.globalAlpha = 0.5;
      ctx.save();
      if (!maat.facingRight) {
        ctx.translate(x+maat.w, 0);
        ctx.scale(-1, 1);
        ctx.translate(-x, 0);
      }
      // Cuerpo
      ctx.fillStyle = '#dde8f5';
      ctx.beginPath(); ctx.ellipse(x+maat.w/2, y+maat.h*0.6, maat.w/2-2, maat.h*0.38, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#f97316';
      ctx.fillRect(x+6*s, y+maat.h*0.45, maat.w-12*s, 4*s);
      // Bandera Argentina (parche izquierdo)
      ctx.save(); ctx.translate(x+maat.w*0.28, y+maat.h*0.62); ctx.scale(0.65,0.65);
      ctx.fillStyle = '#74ACDF'; ctx.fillRect(-12,-8,24,5);
      ctx.fillStyle = '#FFFFFF'; ctx.fillRect(-12,-3,24,5);
      ctx.fillStyle = '#74ACDF'; ctx.fillRect(-12,2,24,5);
      ctx.fillStyle = '#FFD966'; ctx.beginPath(); ctx.arc(0,0,5,0,Math.PI*2); ctx.fill();
      ctx.restore();
      // Huella de pata (parche derecho)
      ctx.save(); ctx.translate(x+maat.w*0.72, y+maat.h*0.62); ctx.fillStyle = '#f59e0b';
      ctx.beginPath(); ctx.ellipse(0,0,5,4,0,0,Math.PI*2); ctx.fill();
      for (let i=-1;i<=1;i++) { ctx.beginPath(); ctx.ellipse(i*6,-4,2.5,3,0,0,Math.PI*2); ctx.fill(); }
      ctx.beginPath(); ctx.ellipse(0,-9,2.5,3.5,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
      // Brazos y piernas
      ctx.fillStyle = '#8fa8c8';
      ctx.fillRect(x-3*s, y+maat.h*0.4, 5*s, maat.h*0.3);
      ctx.fillRect(x+maat.w-2*s, y+maat.h*0.4, 5*s, maat.h*0.3);
      ctx.fillStyle = '#374151';
      ctx.fillRect(x+4*s, y+maat.h-4*s, maat.w*0.35, 4*s);
      ctx.fillRect(x+maat.w-4*s-maat.w*0.35, y+maat.h-4*s, maat.w*0.35, 4*s);
      // Casco
      ctx.fillStyle = '#c8d8f0';
      ctx.beginPath(); ctx.arc(x+maat.w/2, y-2*s, 14*s, 0, Math.PI*2); ctx.fill();
      const visGrad = ctx.createRadialGradient(x+maat.w/2-3*s, y-5*s, 0, x+maat.w/2, y-2*s, 11*s);
      visGrad.addColorStop(0, 'rgba(59,130,246,0.55)');
      visGrad.addColorStop(1, 'rgba(14,68,180,0.45)');
      ctx.fillStyle = visGrad;
      ctx.beginPath(); ctx.arc(x+maat.w/2, y-2*s, 11*s, 0, Math.PI*2); ctx.fill();
      // Cara de gato
      ctx.fillStyle = '#b09070';
      ctx.beginPath(); ctx.arc(x+maat.w/2, y-2*s, 8.5*s, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#e8dcc8';
      ctx.beginPath(); ctx.ellipse(x+maat.w/2, y, 5*s, 4*s, 0, 0, Math.PI*2); ctx.fill();
      [x+maat.w/2-4*s, x+maat.w/2+4*s].forEach(ex => {
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(ex, y-3*s, 3*s, 2.5*s, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#8bc34a'; ctx.beginPath(); ctx.arc(ex, y-3*s, 2*s, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.arc(ex, y-3*s, 1.1*s, 0, Math.PI*2); ctx.fill();
      });
      ctx.fillStyle = '#e8748a';
      ctx.beginPath(); ctx.moveTo(x+maat.w/2, y+1*s); ctx.lineTo(x+maat.w/2-2*s, y-0.5*s); ctx.lineTo(x+maat.w/2+2*s, y-0.5*s); ctx.fill();
      // Orejas
      ctx.fillStyle = '#b09070';
      ctx.beginPath(); ctx.moveTo(x+5*s, y-11*s); ctx.lineTo(x+10*s, y-19*s); ctx.lineTo(x+15*s, y-11*s); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x+maat.w-5*s, y-11*s); ctx.lineTo(x+maat.w-10*s, y-19*s); ctx.lineTo(x+maat.w-15*s, y-11*s); ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    // ---------- BUCLE PRINCIPAL ----------
    function gameLoop() {
      if (!gameRunning) return;
      try {
        updateGame();
        draw();
        animationId = requestAnimationFrame(gameLoop);
      } catch(e) {
        console.error(e);
        // Si ocurre un error, intentamos continuar
        animationId = requestAnimationFrame(gameLoop);
      }
    }

    // ---------- INICIO Y REINICIO ----------
    function startGame() {
      // Detener todo lo anterior
      if (animationId) cancelAnimationFrame(animationId);
      if (respawnTimeout) clearTimeout(respawnTimeout);
      if (musicLoopId) clearInterval(musicLoopId);
      gameRunning = false;
      // Resetear estado
      score = 0;
      lives = 3;
      level = 1;
      yarnsThisLevel = 0;
      particles = [];
      invincibleTimer = 0;
      frameCount = 0;
      levelClearing = false;
      keys = { left: false, right: false };
      jumpRequested = false;
      // Inicializar canvas y dimensiones
      resizeCanvas();
      buildLevel();
      updateHUD();
      // Ocultar overlay
      document.getElementById('overlay').classList.add('hidden');
      // Iniciar audio y música
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (!musicOn) {
        musicOn = true;
        document.getElementById('musicBtn').textContent = '🔊';
        startMusic();
      }
      gameRunning = true;
      animationId = requestAnimationFrame(gameLoop);
    }

    function exitGame() {
      if (!gameRunning) return;
      gameRunning = false;
      if (animationId) cancelAnimationFrame(animationId);
      if (respawnTimeout) clearTimeout(respawnTimeout);
      stopMusic();
      document.getElementById('overlayTitle').innerText = '🚪 MISIÓN ABORTADA';
      document.getElementById('overlaySub').innerHTML = 'Volviste a la base. ¡Prepárate!';
      let scoreDiv = document.getElementById('overlayScore');
      if (!scoreDiv) {
        scoreDiv = document.createElement('div');
        scoreDiv.id = 'overlayScore';
        scoreDiv.className = 'overlay-score-big';
        document.querySelector('.overlay-card').appendChild(scoreDiv);
      }
      scoreDiv.style.display = 'block';
      scoreDiv.innerText = `🧶 Puntaje final: ${score} · ${levelCfg.orbitLabel}`;
      document.getElementById('overlay').classList.remove('hidden');
    }

    // ---------- REDIMENSIONADO ----------
    function resizeCanvas() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      S = Math.min(W / 620, H / 420);
      if (gameRunning && maat) {
        buildLevel();
        resetMaatPos();
      }
    }

    // ---------- EVENTOS ----------
    window.addEventListener('resize', () => { resizeCanvas(); if (gameRunning) draw(); });
    window.addEventListener('keydown', (e) => {
      if (!gameRunning) return;
      if (e.key === 'ArrowLeft') keys.left = true;
      if (e.key === 'ArrowRight') keys.right = true;
      if (e.key === ' ' || e.key === 'ArrowUp') {
        e.preventDefault();
        jumpRequested = true;
      }
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft') keys.left = false;
      if (e.key === 'ArrowRight') keys.right = false;
    });

    // Controles táctiles
    const isMobile = /Mobi|Android|iPhone/i.test(navigator.userAgent);
    if (isMobile) document.getElementById('touchControls').classList.add('active');
    const bindTouch = (id, down, up) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('touchstart', (e) => { e.preventDefault(); down(); el.classList.add('pressed'); }, { passive: false });
      el.addEventListener('touchend', (e) => { e.preventDefault(); if(up) up(); el.classList.remove('pressed'); });
      el.addEventListener('mousedown', down);
      el.addEventListener('mouseup', up);
    };
    bindTouch('btnLeft', () => { if(gameRunning) keys.left = true; }, () => { if(gameRunning) keys.left = false; });
    bindTouch('btnRight', () => { if(gameRunning) keys.right = true; }, () => { if(gameRunning) keys.right = false; });
    bindTouch('btnJump', () => { if(gameRunning) jumpRequested = true; }, null);

    // Botones UI
    document.getElementById('exitBtn').addEventListener('click', exitGame);
    document.getElementById('musicBtn').addEventListener('click', toggleMusic);
    document.getElementById('launchBtn').addEventListener('click', startGame);

    resizeCanvas();
  })();
</script>
</body>
</html>
