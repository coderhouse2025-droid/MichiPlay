<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐱🚀 Maat Astronauta · Misión Espacial</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: #020818;
    overflow: hidden;
    font-family: 'Exo 2', sans-serif;
    width: 100vw;
    height: 100vh;
  }

  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
  }

  /* HUD */
  #hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    pointer-events: none;
    z-index: 10;
  }
  .hud-pill {
    background: rgba(2,8,24,0.7);
    border: 1px solid rgba(34,211,238,0.3);
    border-radius: 50px;
    padding: 7px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    backdrop-filter: blur(10px);
  }
  .hud-score {
    font-family: 'Orbitron', monospace;
    font-size: clamp(14px, 2.5vw, 20px);
    color: #ffe97a;
    letter-spacing: 2px;
  }
  .hud-level {
    font-family: 'Orbitron', monospace;
    font-size: clamp(11px, 1.8vw, 15px);
    color: #22d3ee;
    letter-spacing: 3px;
  }
  .hud-lives {
    font-size: clamp(14px, 2.5vw, 20px);
    letter-spacing: 3px;
  }

  /* Botón EXIT rojo (visible durante el juego) */
  #exitBtn {
    position: absolute;
    top: 14px;
    right: 80px;
    width: 50px;
    height: 50px;
    background: #dc2626;
    border: 2px solid rgba(255,255,200,0.8);
    border-radius: 50%;
    font-family: 'Orbitron', monospace;
    font-weight: bold;
    font-size: 13px;
    color: white;
    text-align: center;
    line-height: 46px;
    cursor: pointer;
    z-index: 25;
    backdrop-filter: blur(4px);
    box-shadow: 0 0 12px rgba(220,38,38,0.6);
    transition: transform 0.2s;
  }
  #exitBtn:hover { transform: scale(1.08); background: #ef4444; }
  #exitBtn:active { transform: scale(0.94); }

  /* Botón música */
  #musicBtn {
    position: absolute;
    top: 14px;
    right: 18px;
    width: 42px;
    height: 42px;
    background: rgba(2,8,24,0.7);
    border: 1px solid rgba(34,211,238,0.3);
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    z-index: 25;
    backdrop-filter: blur(8px);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Overlay principal (inicio / fin) adaptado a la imagen */
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    background: rgba(2,8,24,0.88);
    backdrop-filter: blur(8px);
    transition: opacity 0.5s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .overlay-card {
    background: linear-gradient(160deg, rgba(10,22,40,0.97), rgba(20,10,50,0.97));
    border: 1px solid rgba(34,211,238,0.4);
    border-radius: 32px;
    padding: clamp(28px, 5vw, 52px) clamp(32px, 6vw, 64px);
    text-align: center;
    box-shadow: 0 0 80px rgba(34,211,238,0.2);
    max-width: min(520px, 92vw);
  }
  .overlay-icon {
    font-size: clamp(52px, 10vw, 80px);
    margin-bottom: 8px;
    animation: floatIcon 3s infinite;
  }
  @keyframes floatIcon {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .overlay-title {
    font-family: 'Orbitron', monospace;
    font-size: clamp(22px, 5vw, 42px);
    font-weight: 900;
    color: #fff;
    letter-spacing: 3px;
    text-shadow: 0 0 20px #22d3ee;
  }
  .overlay-sub {
    font-size: clamp(12px, 2vw, 15px);
    color: rgba(200,216,240,0.7);
    margin: 20px 0 28px;
    line-height: 1.5;
  }
  .overlay-score-big {
    font-family: 'Orbitron', monospace;
    font-size: clamp(16px, 3vw, 24px);
    color: #22d3ee;
    margin-bottom: 24px;
  }
  .btn-launch {
    font-family: 'Orbitron', monospace;
    font-size: clamp(14px, 2.5vw, 18px);
    font-weight: 700;
    padding: 12px 40px;
    border-radius: 60px;
    border: none;
    background: linear-gradient(135deg, #22d3ee, #7c3aed);
    color: white;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 8px 25px rgba(34,211,238,0.4);
  }
  .btn-launch:hover {
    transform: scale(1.05);
    box-shadow: 0 12px 35px rgba(34,211,238,0.6);
  }

  /* Controles táctiles */
  #touchControls {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 170px;
    z-index: 10;
    pointer-events: none;
    display: none;
  }
  #touchControls.active {
    display: flex;
    pointer-events: all;
  }
  .t-dpad {
    position: absolute;
    bottom: 22px;
    left: 18px;
    display: flex;
    gap: 10px;
  }
  .t-btn {
    width: 66px;
    height: 66px;
    background: rgba(34,211,238,0.1);
    border: 1.5px solid rgba(34,211,238,0.4);
    border-radius: 16px;
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: #22d3ee;
    cursor: pointer;
  }
  .t-jump {
    position: absolute;
    bottom: 22px;
    right: 18px;
    width: 82px;
    height: 82px;
    border-radius: 50%;
    background: rgba(124,58,237,0.2);
    border-color: #a78bfa;
  }
  .float-text {
    position: absolute;
    font-family: 'Orbitron', monospace;
    font-size: clamp(14px, 2.5vw, 20px);
    color: #ffe97a;
    text-shadow: 0 0 10px #ffb347;
    pointer-events: none;
    z-index: 30;
    animation: floatUp 1s ease-out forwards;
    white-space: nowrap;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-70px) scale(1.2); }
  }
  .hud-shake {
    animation: shake 0.38s ease;
  }
  @keyframes shake {
    0%,100%{ transform: translateX(0); }
    20%{ transform: translateX(-7px); }
    40%{ transform: translateX(7px); }
    60%{ transform: translateX(-4px); }
    80%{ transform: translateX(4px); }
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="hud">
  <div class="hud-pill"><span>🧶</span><span class="hud-score" id="scoreDisplay">000</span></div>
  <div class="hud-pill hud-level" id="levelDisplay">ÓRBITA 1</div>
  <div class="hud-pill"><span class="hud-lives" id="livesDisplay">🐾🐾🐾</span></div>
</div>

<div id="exitBtn">EXIT</div>
<button id="musicBtn">🎵</button>

<div id="overlay">
  <div class="overlay-card">
    <div class="overlay-icon">🐱🚀</div>
    <div class="overlay-title">MAAT ASTRONAUTA</div>
    <div class="overlay-sub">
      ☆ La gata espacial busca ovillos cósmicos por la Luna ☆<br>
      ← → mover &nbsp;&nbsp; ↑ / espacio saltar
    </div>
    <button class="btn-launch" id="launchBtn">🚀 LANZAR MISIÓN</button>
  </div>
</div>

<div id="touchControls">
  <div class="t-dpad"><div class="t-btn" id="btnLeft">◀</div><div class="t-btn" id="btnRight">▶</div></div>
  <div class="t-btn t-jump" id="btnJump">↑</div>
</div>

<script>
(function() {
  // ---------- CANVAS ----------
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let W, H, S;

  // ---------- AUDIO ----------
  let audioCtx = null;
  let musicOn = false;
  let musicNodes = { master: null, chordInterval: null, blipTimeout: null };

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  function playMeow() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    osc1.type = 'sine';
    osc2.type = 'triangle';
    filter.type = 'lowpass';
    filter.frequency.value = 1500;
    gain.gain.value = 0.2;
    osc1.connect(filter);
    osc2.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    osc1.frequency.setValueAtTime(950, now);
    osc1.frequency.exponentialRampToValueAtTime(420, now + 0.28);
    osc2.frequency.setValueAtTime(820, now);
    osc2.frequency.exponentialRampToValueAtTime(380, now + 0.25);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
    osc1.start(); osc2.start();
    osc1.stop(now + 0.5); osc2.stop(now + 0.5);
  }

  function playSFX(type) {
    if (!audioCtx) return;
    if (type === 'meow') { playMeow(); return; }
    if (type === 'jump') {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = 330; o.frequency.setTargetAtTime(660, audioCtx.currentTime, 0.08);
      g.gain.value = 0.07; g.gain.setTargetAtTime(0, audioCtx.currentTime + 0.05, 0.06);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.2);
    } else if (type === 'hurt') {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sawtooth'; o.frequency.value = 220; o.frequency.setTargetAtTime(55, audioCtx.currentTime, 0.15);
      g.gain.value = 0.15; g.gain.setTargetAtTime(0, audioCtx.currentTime + 0.1, 0.1);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.4);
    } else if (type === 'levelup') {
      [523,659,784,1047].forEach((f,i) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'triangle'; o.frequency.value = f;
        g.gain.value = 0.1; g.gain.setTargetAtTime(0, audioCtx.currentTime + 0.15 + i*0.1, 0.08);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(audioCtx.currentTime + i * 0.12);
        o.stop(audioCtx.currentTime + 0.5 + i * 0.12);
      });
    }
  }

  function startSpaceMusic() {
    if (!audioCtx || musicNodes.master) return;
    const master = audioCtx.createGain();
    master.gain.value = 0.35;
    master.connect(audioCtx.destination);
    musicNodes.master = master;

    const chords = [[110,138.6,164.8],[98,123.5,146.8],[130.8,164.8,196],[110,138.6,164.8]];
    let chordIdx = 0;
    let padOscs = [];
    function playChord() {
      padOscs.forEach(n => { n.g.gain.setTargetAtTime(0, audioCtx.currentTime, 1.2); setTimeout(() => { try { n.osc.stop(); } catch(e){} }, 3000); });
      padOscs = [];
      chords[chordIdx % chords.length].forEach(f => {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        osc.type = 'triangle'; osc.frequency.value = f;
        filter.type = 'lowpass'; filter.frequency.value = 800;
        g.gain.value = 0; g.gain.setTargetAtTime(0.065, audioCtx.currentTime, 0.8);
        osc.connect(filter); filter.connect(g); g.connect(master);
        osc.start();
        padOscs.push({ osc, g });
      });
      chordIdx++;
    }
    playChord();
    musicNodes.chordInterval = setInterval(playChord, 5000);
    function spaceBlip() {
      const osc = audioCtx.createOscillator();
      const env = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = 880 + Math.random() * 440;
      osc.frequency.setTargetAtTime(220, audioCtx.currentTime, 0.1);
      env.gain.value = 0.08; env.gain.setTargetAtTime(0, audioCtx.currentTime + 0.02, 0.08);
      osc.connect(env); env.connect(master);
      osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      musicNodes.blipTimeout = setTimeout(spaceBlip, 1200 + Math.random() * 2800);
    }
    spaceBlip();
    const drone = (freq, vol) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = freq; g.gain.value = vol;
      o.connect(g); g.connect(master); o.start();
    };
    drone(55, 0.12); drone(82.4, 0.06);
  }

  function stopSpaceMusic() {
    if (musicNodes.chordInterval) clearInterval(musicNodes.chordInterval);
    if (musicNodes.blipTimeout) clearTimeout(musicNodes.blipTimeout);
    if (musicNodes.master) {
      musicNodes.master.gain.setTargetAtTime(0, audioCtx.currentTime, 0.5);
      setTimeout(() => { try { musicNodes.master.disconnect(); } catch(e){} musicNodes = { master: null }; }, 500);
    }
  }

  function toggleMusic() {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    musicOn = !musicOn;
    document.getElementById('musicBtn').textContent = musicOn ? '🔊' : '🔇';
    if (musicOn) startSpaceMusic();
    else stopSpaceMusic();
  }

  // ---------- ESTADO DEL JUEGO ----------
  let gameRunning = false;
  let animationId = null;
  let score = 0, lives = 3, level = 1;
  let yarnsThisLevel = 0, levelCfg = {};
  let particles = [];
  let shootingStars = [];
  let bgStars = [];
  let nebulae = [];
  let moonCraters = [];
  let platforms = [];
  let hazards = [];
  let yarnBall = {};
  let maat = {};
  let invincibleTimer = 0;
  let jumpRequested = false;
  let keys = { left: false, right: false };
  let frameCount = 0;
  let levelClearing = false;
  let levelClearTimer = 0;

  const MAX_PARTICLES = 200;

  // ---------- CONFIGURACIÓN DE NIVEL ----------
  function getLevelCfg(lvl) {
    const b = lvl - 1;
    return {
      yarnsNeeded: 4 + b * 2,
      orbitLabel: ['ÓRBITA 1', 'LUNA', 'ASTEROIDE', 'NEBULOSA', 'ABISMO'][Math.min(b, 4)]
    };
  }

  // ---------- CONSTRUIR MUNDO ----------
  function rebuildLevel() {
    levelCfg = getLevelCfg(level);
    const ph = 13 * S;
    const rawPlatforms = [
      [0.02,0.88,0.20,ph],[0.25,0.83,0.17,ph],[0.46,0.88,0.18,ph],[0.68,0.85,0.17,ph],[0.82,0.90,0.16,ph],
      [0.03,0.72,0.14,ph],[0.22,0.67,0.14,ph],[0.42,0.70,0.12,ph],[0.60,0.68,0.14,ph],[0.78,0.72,0.13,ph],
      [0.10,0.54,0.12,ph],[0.32,0.52,0.11,ph],[0.55,0.54,0.12,ph],[0.74,0.56,0.11,ph],
      [0.20,0.38,0.10,ph],[0.46,0.36,0.10,ph],[0.68,0.40,0.09,ph]
    ];
    platforms = rawPlatforms.map(r => ({ x: r[0]*W, y: r[1]*H, w: r[2]*W, h: r[3] }));
    platforms.push({ x:0, y:H+10, w:W, h:20 }); // suelo mortal

    const rawHazards = [[0.27,0.805],[0.50,0.855],[0.72,0.825],[0.26,0.640],[0.64,0.650],[0.34,0.490],[0.77,0.535]];
    hazards = rawHazards.map(([rx,ry],i) => ({
      x: rx*W, y: ry*H - 16*S, w: 14*S, h: 16*S,
      baseX: rx*W, dir: i%2===0 ? 1 : -1,
      speed: (0.5 + (level-1)*0.2) * S,
      range: 22*S,
      type: i % 3
    }));

    // Elementos visuales
    bgStars = Array.from({length: 140}, () => ({
      x: Math.random()*W, y: Math.random()*H*0.8,
      r: Math.random()*2 + 0.8, alpha: Math.random()*0.6+0.2,
      twinkle: Math.random()*Math.PI*2, speed: 0.02 + Math.random()*0.03
    }));
    nebulae = Array.from({length: 3}, () => ({
      x: Math.random()*W, y: Math.random()*H*0.5,
      rx: (60+Math.random()*100)*S, ry: (30+Math.random()*60)*S,
      hue: [260, 300, 210][Math.floor(Math.random()*3)], alpha: 0.04+Math.random()*0.05
    }));
    moonCraters = Array.from({length: 10}, () => ({
      x: (0.05+Math.random()*0.8)*W, y: H - 6*S, r: (3+Math.random()*9)*S
    }));
    shootingStars = [];
    if (!maat.x) resetMaatPos();
    respawnYarn();
  }

  function resetMaatPos() {
    maat = {
      x: 60*S, y: H*0.82, vx:0, vy:0,
      w: 30*S, h: 30*S, grounded: false, facingRight: true,
      jumpPower: -11*S, gravity: 0.55*S,
      maxSpeed: 5*S, friction: 0.87, accel: 0.7*S
    };
  }

  function respawnYarn() {
    const safe = platforms.filter(p => p.y < H*0.95);
    const p = safe[Math.floor(Math.random()*safe.length)];
    let cx = p.x + p.w/2, cy = p.y - 11*S;
    if (maat.x && Math.abs(maat.x - cx) < 40*S) cx = (cx + 100*S) % (W - 50*S);
    yarnBall = {
      x: cx, y: cy, r: 9*S, collected: false,
      bob: Math.random()*Math.PI*2, spin: 0, glow: 0
    };
  }

  // ---------- ACTUALIZACIÓN DE LÓGICA ----------
  function updateGame() {
    if (levelClearing) {
      levelClearTimer--;
      if (levelClearTimer <= 0) nextLevel();
      return;
    }

    // Movimiento obstáculos
    for (let h of hazards) {
      h.x += h.speed * h.dir;
      if (Math.abs(h.x - h.baseX) > h.range) h.dir *= -1;
    }

    // Movimiento Maat
    if (keys.left) {
      maat.vx = Math.max(-maat.maxSpeed, maat.vx - maat.accel);
      maat.facingRight = false;
    }
    if (keys.right) {
      maat.vx = Math.min(maat.maxSpeed, maat.vx + maat.accel);
      maat.facingRight = true;
    }
    if (!keys.left && !keys.right) maat.vx *= maat.friction;
    maat.vy += maat.gravity;
    maat.x += maat.vx;
    maat.y += maat.vy;

    // Bordes
    if (maat.x < 0) { maat.x = 0; maat.vx = 0; }
    if (maat.x + maat.w > W) { maat.x = W - maat.w; maat.vx = 0; }

    // Colisión con plataformas
    maat.grounded = false;
    for (let p of platforms) {
      if (maat.vy >= 0 && maat.x+maat.w > p.x+4 && maat.x < p.x+p.w-4 &&
          maat.y+maat.h <= p.y+8 && maat.y+maat.h+maat.vy >= p.y) {
        maat.y = p.y - maat.h;
        maat.vy = 0;
        maat.grounded = true;
      }
    }

    // Salto
    if (jumpRequested && maat.grounded) {
      maat.vy = maat.jumpPower;
      jumpRequested = false;
      playSFX('jump');
    }
    jumpRequested = false;

    // Caída al vacío
    if (maat.y > H + 60) {
      hurtMaat();
      resetMaatPos();
    }

    // Daño por obstáculos
    if (invincibleTimer <= 0) {
      for (let h of hazards) {
        if (maat.x+maat.w > h.x+4 && maat.x < h.x+h.w-4 &&
            maat.y+maat.h > h.y+4 && maat.y < h.y+h.h-4) {
          hurtMaat();
          maat.vx = maat.facingRight ? -5*S : 5*S;
          maat.vy = -6*S;
          break;
        }
      }
    }
    if (invincibleTimer > 0) invincibleTimer--;

    // Ovillo
    yarnBall.bob += 0.07;
    yarnBall.spin += 0.03;
    yarnBall.glow = 0.5 + 0.5*Math.sin(frameCount*0.09);
    if (!yarnBall.collected) {
      const dx = maat.x + maat.w/2 - yarnBall.x;
      const dy = maat.y + maat.h/2 - yarnBall.y;
      if (Math.hypot(dx, dy) < yarnBall.r + maat.w/2 - 4) {
        yarnBall.collected = true;
        score++;
        yarnsThisLevel++;
        updateHUD();
        spawnParticles(yarnBall.x, yarnBall.y, ['#ffe97a','#22d3ee','#a78bfa'], 18);
        showFloat(yarnBall.x, yarnBall.y, '+1 🧶 ¡MIAU!');
        playSFX('meow');
        if (score % 8 === 0 && lives < 5) {
          lives++;
          updateHUD();
          showFloat(maat.x, maat.y-20*S, '❤️ +Vida');
        }
        if (yarnsThisLevel >= levelCfg.yarnsNeeded) {
          levelClearing = true;
          levelClearTimer = 100;
          playSFX('levelup');
        } else {
          setTimeout(respawnYarn, 500);
        }
      }
    }

    // Partículas (limitar cantidad)
    for (let i=particles.length-1; i>=0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.18*S;
      p.life -= p.decay;
      if (p.life <= 0) particles.splice(i,1);
    }
    if (particles.length > MAX_PARTICLES) particles = particles.slice(-MAX_PARTICLES);

    // Estrellas fugaces
    frameCount++;
    if (frameCount % 180 === 0 && shootingStars.length < 3) {
      shootingStars.push({
        x: Math.random()*W*0.7, y: Math.random()*H*0.3,
        vx: (3+Math.random()*4)*S, vy: (1.5+Math.random()*2)*S,
        life: 1
      });
    }
    for (let i=shootingStars.length-1; i>=0; i--) {
      const s = shootingStars[i];
      s.x += s.vx; s.y += s.vy;
      s.life -= 0.02;
      if (s.life <= 0 || s.x > W || s.y > H) shootingStars.splice(i,1);
    }
    // Fondo estrellas titilantes
    for (let s of bgStars) {
      s.twinkle += s.speed;
      s.alpha = 0.25 + 0.65 * Math.abs(Math.sin(s.twinkle));
    }
  }

  function hurtMaat() {
    lives--;
    invincibleTimer = 75;
    spawnParticles(maat.x+maat.w/2, maat.y+maat.h/2, ['#ef4444','#f97316'], 12);
    updateHUD();
    playSFX('hurt');
    document.getElementById('hud').classList.add('hud-shake');
    setTimeout(() => document.getElementById('hud').classList.remove('hud-shake'), 400);
    if (lives <= 0) endGame();
  }

  function nextLevel() {
    level++;
    yarnsThisLevel = 0;
    levelClearing = false;
    rebuildLevel();
    resetMaatPos();
    updateHUD();
  }

  function endGame() {
    gameRunning = false;
    if (animationId) cancelAnimationFrame(animationId);
    stopSpaceMusic();
    document.getElementById('overlayTitle').innerText = '💀 MISIÓN FALLIDA 💀';
    document.getElementById('overlaySub').innerHTML = 'Maat se quedó sin oxígeno...<br>¿Lo intentas de nuevo?';
    const scoreDiv = document.getElementById('overlayScore');
    if (!scoreDiv) {
      const newDiv = document.createElement('div');
      newDiv.id = 'overlayScore';
      newDiv.className = 'overlay-score-big';
      document.querySelector('.overlay-card').appendChild(newDiv);
    }
    document.getElementById('overlayScore').style.display = 'block';
    document.getElementById('overlayScore').innerText = `🧶 Ovillos: ${score}  ·  ${levelCfg.orbitLabel}`;
    document.getElementById('overlay').classList.remove('hidden');
  }

  function updateHUD() {
    document.getElementById('scoreDisplay').innerText = String(score).padStart(3,'0');
    document.getElementById('levelDisplay').innerText = levelCfg.orbitLabel || `ÓRBITA ${level}`;
    const hearts = '🐾'.repeat(lives) + '💀'.repeat(Math.max(0, 3-lives));
    document.getElementById('livesDisplay').innerText = hearts;
  }

  function showFloat(x, y, text) {
    const el = document.createElement('div');
    el.className = 'float-text';
    el.textContent = text;
    el.style.left = Math.min(Math.max(x-50, 10), W-120) + 'px';
    el.style.top = Math.min(Math.max(y-30, 10), H-80) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }

  function spawnParticles(x, y, colors, count) {
    for (let i=0; i<count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = (1 + Math.random() * 4) * S;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2*S,
        r: (2 + Math.random() * 4) * S,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: 1,
        decay: 0.03 + Math.random() * 0.04
      });
    }
  }

  // ---------- DIBUJO ----------
  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawSpace();
    drawPlatforms();
    drawHazards();
    if (!yarnBall.collected) drawYarn();
    drawParticles();
    drawMaat();
    drawProgressBar();
  }

  function drawSpace() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#03091a');
    grad.addColorStop(1, '#0c1428');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    // Nebulosas
    for (let n of nebulae) {
      ctx.globalAlpha = n.alpha;
      const gr = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.rx);
      gr.addColorStop(0, `hsla(${n.hue}, 80%, 65%, 0.9)`);
      gr.addColorStop(1, `hsla(${n.hue}, 60%, 40%, 0)`);
      ctx.fillStyle = gr;
      ctx.save();
      ctx.translate(n.x, n.y);
      ctx.scale(1, n.ry / n.rx);
      ctx.translate(-n.x, -n.y);
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.rx, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    // Estrellas
    for (let s of bgStars) {
      ctx.globalAlpha = s.alpha;
      ctx.fillStyle = `rgb(255, ${200 + Math.random()*55}, 150)`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    }
    // Estrellas fugaces
    for (let ss of shootingStars) {
      ctx.save();
      ctx.globalAlpha = ss.life * 0.8;
      ctx.beginPath();
      ctx.moveTo(ss.x, ss.y);
      ctx.lineTo(ss.x - ss.vx*8, ss.y - ss.vy*8);
      ctx.lineWidth = 2 * S;
      ctx.strokeStyle = `rgba(255, 230, 180, ${ss.life})`;
      ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    // Luna grande
    const mx = W*0.85, my = H*0.12, mr = 60 * S;
    ctx.shadowBlur = 20 * S;
    ctx.shadowColor = 'rgba(200,220,255,0.4)';
    ctx.fillStyle = '#f4f9ff';
    ctx.beginPath();
    ctx.arc(mx, my, mr, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(150,170,200,0.5)';
    [[0.3,0.2,0.18],[0.6,0.55,0.12],[0.2,0.65,0.09]].forEach(([fx,fy,fr]) => {
      ctx.beginPath();
      ctx.arc(mx + fx*mr*1.6 - mr*0.6, my + fy*mr*1.6 - mr*0.6, fr*mr, 0, Math.PI*2);
      ctx.fill();
    });
    // Suelo lunar
    const groundY = H - 13*S;
    ctx.fillStyle = '#7f8c9a';
    ctx.fillRect(0, groundY, W, 13*S);
    ctx.fillStyle = 'rgba(50,60,70,0.6)';
    for (let c of moonCraters) {
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, c.r, c.r*0.4, 0, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function drawPlatforms() {
    for (let p of platforms) {
      if (p.y >= H) continue;
      ctx.fillStyle = '#9aaec9';
      ctx.shadowBlur = 5 * S;
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#c0d0e5';
      ctx.fillRect(p.x+3, p.y-2, p.w-6, 4);
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      for (let i=0;i<4;i++) ctx.fillRect(p.x+5+i*12, p.y+4, 3, p.h-7);
      ctx.shadowBlur = 0;
    }
  }

  function drawHazards() {
    for (let h of hazards) {
      const cx = h.x+h.w/2, cy = h.y+h.h/2;
      ctx.fillStyle = h.type === 0 ? '#9b7653' : (h.type === 1 ? '#5f9eff' : '#e34234');
      ctx.beginPath();
      ctx.ellipse(cx, cy, h.w/2, h.h/2, 0, 0, Math.PI*2);
      ctx.fill();
      if (h.type === 1) { // robot
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(cx-h.w*0.2, cy-h.h*0.2, h.w*0.18, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx+h.w*0.2, cy-h.h*0.2, h.w*0.18, 0, Math.PI*2); ctx.fill();
      }
      if (h.type === 2) { // mina
        for (let i=0;i<6;i++) {
          const ang = i * Math.PI*2/6;
          ctx.beginPath();
          ctx.moveTo(cx+Math.cos(ang)*h.w/2, cy+Math.sin(ang)*h.h/2);
          ctx.lineTo(cx+Math.cos(ang)*h.w*0.9, cy+Math.sin(ang)*h.h*0.9);
          ctx.lineWidth = 2.5*S;
          ctx.strokeStyle = '#ffaa66';
          ctx.stroke();
        }
      }
    }
  }

  function drawYarn() {
    const bx = yarnBall.x, by = yarnBall.y + Math.sin(yarnBall.bob)*5*S;
    ctx.shadowBlur = 18 * S * yarnBall.glow;
    ctx.shadowColor = '#c084fc';
    ctx.fillStyle = '#c084fc';
    ctx.beginPath();
    ctx.arc(bx, by, yarnBall.r, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(yarnBall.spin);
    for (let i=0; i<4; i++) {
      ctx.fillStyle = ['#a855f7','#7e22ce','#d8b4fe','#9333ea'][i];
      ctx.beginPath();
      ctx.ellipse(Math.cos(i*Math.PI/2)*yarnBall.r*0.4, Math.sin(i*Math.PI/2)*yarnBall.r*0.4,
                  yarnBall.r*0.55, yarnBall.r*0.3, i*Math.PI/2, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawMaat() {
    const x = maat.x, y = maat.y, s = S;
    if (invincibleTimer > 0 && Math.floor(frameCount/4)%2 === 0) ctx.globalAlpha = 0.5;
    ctx.save();
    if (!maat.facingRight) {
      ctx.translate(x+maat.w, 0);
      ctx.scale(-1, 1);
      ctx.translate(-x, 0);
    }
    // Cuerpo
    ctx.fillStyle = '#dde8f5';
    ctx.beginPath();
    ctx.ellipse(x+maat.w/2, y+maat.h*0.6, maat.w/2-2, maat.h*0.38, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#f97316';
    ctx.fillRect(x+6*s, y+maat.h*0.45, maat.w-12*s, 4*s);
    // PARCHES: bandera argentina y huella
    ctx.save();
    ctx.translate(x+maat.w*0.28, y+maat.h*0.62);
    ctx.scale(0.7, 0.7);
    ctx.fillStyle = '#74ACDF'; ctx.fillRect(-12,-8,24,5);
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(-12,-3,24,5);
    ctx.fillStyle = '#74ACDF'; ctx.fillRect(-12,2,24,5);
    ctx.fillStyle = '#FFD966'; ctx.beginPath(); ctx.arc(0,0,5,0,Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.translate(x+maat.w*0.72, y+maat.h*0.62);
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath(); ctx.ellipse(0,0,6,5,0,0,Math.PI*2); ctx.fill();
    for (let i=-1; i<=1; i++) {
      ctx.beginPath(); ctx.ellipse(i*7, -5, 3, 3.5, 0, 0, Math.PI*2); ctx.fill();
    }
    ctx.beginPath(); ctx.ellipse(0, -11, 3, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    // Brazos y piernas
    ctx.fillStyle = '#8fa8c8';
    ctx.fillRect(x-3*s, y+maat.h*0.4, 5*s, maat.h*0.3);
    ctx.fillRect(x+maat.w-2*s, y+maat.h*0.4, 5*s, maat.h*0.3);
    ctx.fillStyle = '#7c3aed';
    ctx.beginPath(); ctx.arc(x-1.5*s, y+maat.h*0.7, 3.5*s, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+maat.w+1.5*s, y+maat.h*0.7, 3.5*s, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#374151';
    ctx.fillRect(x+4*s, y+maat.h-4*s, maat.w*0.35, 4*s);
    ctx.fillRect(x+maat.w-4*s-maat.w*0.35, y+maat.h-4*s, maat.w*0.35, 4*s);

    // Casco
    ctx.fillStyle = '#c8d8f0';
    ctx.beginPath(); ctx.arc(x+maat.w/2, y-2*s, 14*s, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#8fa8c8';
    ctx.fillRect(x+7*s, y+maat.h*0.28, maat.w-14*s, 5*s);
    const visGrad = ctx.createRadialGradient(x+maat.w/2-3*s, y-5*s, 0, x+maat.w/2, y-2*s, 11*s);
    visGrad.addColorStop(0, 'rgba(59,130,246,0.55)');
    visGrad.addColorStop(1, 'rgba(14,68,180,0.45)');
    ctx.fillStyle = visGrad;
    ctx.beginPath(); ctx.arc(x+maat.w/2, y-2*s, 11*s, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.ellipse(x+maat.w/2-3*s, y-8*s, 4*s, 2.5*s, -0.5, 0, Math.PI*2); ctx.fill();

    // Cara de gato dentro del casco
    ctx.fillStyle = '#b09070';
    ctx.beginPath(); ctx.arc(x+maat.w/2, y-2*s, 8.5*s, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e8dcc8';
    ctx.beginPath(); ctx.ellipse(x+maat.w/2, y, 5*s, 4*s, 0, 0, Math.PI*2); ctx.fill();
    [x+maat.w/2-4*s, x+maat.w/2+4*s].forEach(ex => {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(ex, y-3*s, 3*s, 2.5*s, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#8bc34a';
      ctx.beginPath(); ctx.arc(ex, y-3*s, 2*s, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.arc(ex, y-3*s, 1.1*s, 0, Math.PI*2); ctx.fill();
    });
    ctx.fillStyle = '#e8748a';
    ctx.beginPath();
    ctx.moveTo(x+maat.w/2, y+1*s);
    ctx.lineTo(x+maat.w/2-2*s, y-0.5*s);
    ctx.lineTo(x+maat.w/2+2*s, y-0.5*s);
    ctx.fill();
    // Orejitas
    ctx.fillStyle = '#b09070';
    ctx.beginPath(); ctx.moveTo(x+5*s, y-11*s); ctx.lineTo(x+10*s, y-19*s); ctx.lineTo(x+15*s, y-11*s); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x+maat.w-5*s, y-11*s); ctx.lineTo(x+maat.w-10*s, y-19*s); ctx.lineTo(x+maat.w-15*s, y-11*s); ctx.fill();

    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawProgressBar() {
    const total = levelCfg.yarnsNeeded || 4;
    const done = Math.min(yarnsThisLevel, total);
    const bw = 150 * S, bh = 8 * S;
    const bx = W/2 - bw/2, by = H - 24*S;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(bx, by, bw, bh);
    const grad = ctx.createLinearGradient(bx, by, bx+bw, by);
    grad.addColorStop(0, '#22d3ee');
    grad.addColorStop(1, '#7c3aed');
    ctx.fillStyle = grad;
    ctx.fillRect(bx, by, bw * (done/total), bh);
    ctx.fillStyle = '#e2e8f0';
    ctx.font = `${9*S}px Orbitron`;
    ctx.textAlign = 'center';
    ctx.fillText(`${done}/${total} 🧶`, W/2, by - 6);
    ctx.textAlign = 'left';
  }

  function drawParticles() {
    for (let p of particles) {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- INICIO DEL JUEGO ----------
  function startGame() {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if (animationId) cancelAnimationFrame(animationId);
    gameRunning = true;
    score = 0; lives = 3; level = 1; yarnsThisLevel = 0;
    frameCount = 0; levelClearing = false; particles = [];
    resizeCanvas();
    resetMaatPos();
    rebuildLevel();
    updateHUD();
    document.getElementById('overlay').classList.add('hidden');
    if (!musicOn) {
      musicOn = true;
      document.getElementById('musicBtn').textContent = '🔊';
      startSpaceMusic();
    }
    function loop() {
      if (!gameRunning) return;
      updateGame();
      draw();
      animationId = requestAnimationFrame(loop);
    }
    animationId = requestAnimationFrame(loop);
  }

  function exitGame() {
    if (!gameRunning) return;
    gameRunning = false;
    if (animationId) cancelAnimationFrame(animationId);
    stopSpaceMusic();
    document.getElementById('overlayTitle').innerText = '🚪 MISIÓN ABORTADA';
    document.getElementById('overlaySub').innerHTML = 'Volviste a la base. ¡Prepárate para el próximo despegue!';
    if (!document.getElementById('overlayScore')) {
      const newDiv = document.createElement('div');
      newDiv.id = 'overlayScore';
      newDiv.className = 'overlay-score-big';
      document.querySelector('.overlay-card').appendChild(newDiv);
    }
    document.getElementById('overlayScore').style.display = 'block';
    document.getElementById('overlayScore').innerText = `🧶 Puntaje final: ${score} · ${levelCfg.orbitLabel}`;
    document.getElementById('overlay').classList.remove('hidden');
  }

  // ---------- EVENTOS Y REDIMENSIONADO ----------
  function resizeCanvas() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    S = Math.min(W / 620, H / 420);
    if (gameRunning) rebuildLevel();
  }
  window.addEventListener('resize', resizeCanvas);

  // Controles teclado
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') keys.left = true;
    if (e.key === 'ArrowRight') keys.right = true;
    if (e.key === ' ' || e.key === 'ArrowUp') {
      e.preventDefault();
      jumpRequested = true;
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft') keys.left = false;
    if (e.key === 'ArrowRight') keys.right = false;
  });

  // Táctiles
  const isMobile = /Mobi|Android|iPhone/i.test(navigator.userAgent);
  if (isMobile) document.getElementById('touchControls').classList.add('active');
  const bindTouch = (id, down, up) => {
    const el = document.getElementById(id);
    if (!el) return;
    const handleStart = (e) => { e.preventDefault(); down(); el.classList.add('pressed'); };
    const handleEnd = (e) => { e.preventDefault(); if (up) up(); el.classList.remove('pressed'); };
    el.addEventListener('touchstart', handleStart, { passive: false });
    el.addEventListener('touchend', handleEnd);
    el.addEventListener('mousedown', handleStart);
    el.addEventListener('mouseup', handleEnd);
  };
  bindTouch('btnLeft', () => keys.left = true, () => keys.left = false);
  bindTouch('btnRight', () => keys.right = true, () => keys.right = false);
  bindTouch('btnJump', () => jumpRequested = true, null);

  // Botones UI
  document.getElementById('exitBtn').addEventListener('click', exitGame);
  document.getElementById('musicBtn').addEventListener('click', toggleMusic);
  document.getElementById('launchBtn').addEventListener('click', startGame);

  resizeCanvas();
})();
</script>
</body>
</html>
