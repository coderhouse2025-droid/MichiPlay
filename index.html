<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐱🚀 Maat Astronauta</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --space-dark: #020818;
    --space-blue: #0a1628;
    --neon-blue: #4FC3F7;
    --neon-purple: #7B61FF;
    --neon-pink: #FF6EC7;
    --neon-green: #39FF14;
    --gold: #FFD700;
    --card-bg: rgba(10, 22, 60, 0.85);
  }

  body {
    background: var(--space-dark);
    font-family: 'Exo 2', sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ===== STARFIELD ===== */
  #starfield {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
  }

  /* ===== SCREENS ===== */
  .screen {
    position: fixed; inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .screen.active { display: flex; }

  /* ===== MENU SCREEN ===== */
  #menuScreen {
    flex-direction: column;
    background: radial-gradient(ellipse at 50% 30%, #0d1f4a 0%, #020818 70%);
  }

  .menu-card {
    background: var(--card-bg);
    border: 1px solid rgba(79, 195, 247, 0.3);
    border-radius: 24px;
    padding: 36px 40px 40px;
    max-width: 420px;
    width: 90vw;
    text-align: center;
    backdrop-filter: blur(20px);
    box-shadow: 0 0 60px rgba(79, 195, 247, 0.15), 0 0 120px rgba(123, 97, 255, 0.1), inset 0 1px 0 rgba(255,255,255,0.08);
    animation: cardFloat 4s ease-in-out infinite;
    position: relative;
    z-index: 2;
  }

  @keyframes cardFloat {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
  }

  .menu-cat-img {
    width: 200px;
    height: 200px;
    object-fit: cover;
    object-position: center top;
    border-radius: 16px;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 20px rgba(79, 195, 247, 0.4));
  }

  .rocket-emoji {
    font-size: 48px;
    margin-left: 8px;
    display: inline-block;
    animation: rocketBob 2s ease-in-out infinite;
  }

  @keyframes rocketBob {
    0%, 100% { transform: translateY(0) rotate(-10deg); }
    50% { transform: translateY(-10px) rotate(5deg); }
  }

  .menu-title {
    font-family: 'Orbitron', monospace;
    font-size: clamp(22px, 5vw, 32px);
    font-weight: 900;
    color: #fff;
    letter-spacing: 3px;
    margin-bottom: 12px;
    text-shadow: 0 0 20px rgba(79, 195, 247, 0.8);
  }

  .menu-subtitle {
    color: rgba(200, 220, 255, 0.7);
    font-size: 14px;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .menu-controls {
    color: rgba(180, 200, 240, 0.6);
    font-size: 13px;
    margin-bottom: 28px;
  }

  .btn-launch {
    background: linear-gradient(135deg, #4FC3F7, #7B61FF);
    border: none;
    border-radius: 50px;
    padding: 16px 48px;
    font-family: 'Orbitron', monospace;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 2px;
    cursor: pointer;
    width: 100%;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 30px rgba(79, 195, 247, 0.4);
  }
  .btn-launch:hover {
    transform: scale(1.04);
    box-shadow: 0 6px 40px rgba(79, 195, 247, 0.7);
  }
  .btn-launch:active { transform: scale(0.97); }

  /* ===== TOP BAR ===== */
  #topBar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 52px;
    background: rgba(2, 8, 24, 0.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(79, 195, 247, 0.2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 100;
    display: none;
  }
  #topBar.visible { display: flex; }

  .top-brand {
    font-family: 'Orbitron', monospace;
    font-size: 12px;
    color: var(--neon-blue);
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .top-score {
    font-family: 'Orbitron', monospace;
    font-size: 14px;
    color: var(--gold);
    letter-spacing: 1px;
  }

  .top-level {
    font-family: 'Orbitron', monospace;
    font-size: 12px;
    color: var(--neon-purple);
  }

  #btnExit {
    background: radial-gradient(circle, #ff4444, #cc0000);
    border: 2px solid rgba(255,100,100,0.5);
    color: white;
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 50px;
    cursor: pointer;
    letter-spacing: 1px;
    box-shadow: 0 0 15px rgba(255,0,0,0.5);
    transition: all 0.2s;
  }
  #btnExit:hover { box-shadow: 0 0 25px rgba(255,0,0,0.8); transform: scale(1.05); }

  /* ===== GAME CANVAS ===== */
  #gameCanvas {
    position: fixed;
    top: 52px; left: 0;
    width: 100vw;
    height: calc(100vh - 52px);
    display: none;
    z-index: 5;
  }
  #gameCanvas.visible { display: block; }

  /* ===== MOBILE CONTROLS ===== */
  #mobileControls {
    position: fixed;
    bottom: 16px;
    left: 0; right: 0;
    display: none;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 200;
    pointer-events: none;
  }
  #mobileControls.visible { display: flex; }

  .mobile-btn {
    background: rgba(79, 195, 247, 0.15);
    border: 2px solid rgba(79, 195, 247, 0.4);
    border-radius: 50%;
    width: 60px; height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    cursor: pointer;
    pointer-events: all;
    user-select: none;
    -webkit-user-select: none;
    backdrop-filter: blur(10px);
    transition: background 0.1s;
  }
  .mobile-btn:active { background: rgba(79, 195, 247, 0.35); }

  .left-btns { display: flex; gap: 12px; }
  .right-btns { display: flex; gap: 12px; }

  /* ===== LEVEL TRANSITION ===== */
  #levelTransition {
    position: fixed; inset: 0;
    background: rgba(2, 8, 24, 0.95);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 300;
    animation: fadeIn 0.3s;
  }
  #levelTransition.visible { display: flex; }

  .level-title-big {
    font-family: 'Orbitron', monospace;
    font-size: clamp(36px, 8vw, 64px);
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 40px var(--neon-blue);
    margin-bottom: 12px;
    animation: zoomIn 0.5s ease-out;
  }
  .level-theme {
    font-size: 20px;
    color: var(--neon-blue);
    letter-spacing: 3px;
    animation: zoomIn 0.6s ease-out;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes zoomIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* ===== WIN SCREEN ===== */
  #winScreen {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 50% 50%, #0a1628, #020818);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 400;
    overflow: hidden;
  }
  #winScreen.visible { display: flex; }

  #winCanvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
  }

  .win-text {
    position: relative;
    z-index: 10;
    text-align: center;
    font-family: 'Orbitron', monospace;
    font-size: clamp(28px, 7vw, 56px);
    font-weight: 900;
    color: var(--gold);
    text-shadow: 0 0 40px rgba(255, 215, 0, 0.8);
    animation: pulse 1s ease-in-out infinite;
    display: none;
  }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }

  /* ===== PAUSE OVERLAY ===== */
  #pauseMsg {
    position: fixed;
    inset: 0;
    background: rgba(2,8,24,0.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 250;
    font-family: 'Orbitron', monospace;
    font-size: 36px;
    color: var(--neon-blue);
  }
  #pauseMsg.visible { display: flex; }
</style>
</head>
