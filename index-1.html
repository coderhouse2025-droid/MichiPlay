<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐱🚀 Maat Astronauta</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#020818;font-family:'Exo 2',sans-serif;overflow:hidden;width:100vw;height:100vh;touch-action:none;}

/* ===== MENU ===== */
#menuScreen{
  position:fixed;inset:0;z-index:50;background:#020818;
  display:flex;flex-direction:column;
}
#menuScreen.hidden{display:none;}
.menu-bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;opacity:0.82;}
.menu-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(2,8,24,0.1) 0%,rgba(2,8,24,0.0) 30%,rgba(2,8,24,0.65) 60%,rgba(2,8,24,0.97) 100%);
}
.menu-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:flex-end;align-items:center;padding:20px 22px;gap:12px;z-index:5;}
.btn-exit-menu{
  background:radial-gradient(circle,#ff3333,#aa0000);
  border:2.5px solid rgba(255,80,80,0.55);color:#fff;
  font-family:'Orbitron',monospace;font-weight:700;font-size:13px;letter-spacing:1px;
  padding:10px 22px;border-radius:50px;cursor:pointer;
  box-shadow:0 0 22px rgba(255,0,0,0.65);transition:all .2s;
}
.btn-exit-menu:hover{box-shadow:0 0 38px rgba(255,0,0,.9);transform:scale(1.05);}
.btn-music-menu{
  background:rgba(10,22,60,0.7);border:2px solid rgba(79,195,247,0.4);
  border-radius:50%;width:50px;height:50px;display:flex;align-items:center;justify-content:center;
  font-size:20px;cursor:pointer;backdrop-filter:blur(10px);transition:all .2s;
}
.btn-music-menu:hover{background:rgba(79,195,247,0.2);}
.btn-music-menu.muted{opacity:0.45;}
.menu-bottom{
  position:absolute;bottom:0;left:0;right:0;
  display:flex;flex-direction:column;align-items:center;
  padding:0 28px 52px;z-index:5;
}
.menu-paw{font-size:30px;margin-bottom:8px;filter:drop-shadow(0 0 8px rgba(79,195,247,0.6));}
.menu-title{
  font-family:'Orbitron',monospace;font-weight:900;
  font-size:clamp(24px,7vw,42px);letter-spacing:4px;
  color:#fff;text-shadow:0 0 30px rgba(79,195,247,0.9),0 2px 8px rgba(0,0,0,0.8);
  margin-bottom:10px;text-align:center;
}
.menu-subtitle{color:rgba(180,215,255,0.75);font-size:14px;letter-spacing:1.5px;margin-bottom:6px;text-align:center;}
.menu-controls{color:rgba(150,185,235,0.55);font-size:12px;margin-bottom:30px;text-align:center;}
.btn-launch{
  background:linear-gradient(135deg,#4FC3F7,#7B61FF);
  border:none;border-radius:50px;padding:18px 0;width:100%;max-width:400px;
  font-family:'Orbitron',monospace;font-size:16px;font-weight:700;
  color:#fff;letter-spacing:3px;cursor:pointer;
  box-shadow:0 4px 40px rgba(79,195,247,0.55);transition:all .2s;position:relative;overflow:hidden;
}
.btn-launch::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.18),transparent);border-radius:50px;}
.btn-launch:hover{transform:scale(1.03);box-shadow:0 6px 55px rgba(79,195,247,0.85);}
.btn-launch:active{transform:scale(0.97);}

/* ===== TOP BAR ===== */
#topBar{
  position:fixed;top:0;left:0;right:0;height:52px;
  background:rgba(2,8,24,0.93);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(79,195,247,0.2);
  display:none;align-items:center;justify-content:space-between;
  padding:0 14px;z-index:100;
}
#topBar.visible{display:flex;}
.hud-brand{font-family:'Orbitron',monospace;font-size:11px;color:#4FC3F7;letter-spacing:2px;}
.hud-level{font-family:'Orbitron',monospace;font-size:12px;color:#7B61FF;}
.hud-score{font-family:'Orbitron',monospace;font-size:14px;color:#FFD700;}
.hud-lives{font-size:16px;letter-spacing:2px;}
#btnExit{
  background:radial-gradient(circle,#ff4444,#cc0000);
  border:2px solid rgba(255,100,100,0.5);color:#fff;
  font-family:'Orbitron',monospace;font-size:10px;font-weight:700;
  padding:5px 12px;border-radius:50px;cursor:pointer;letter-spacing:1px;
  box-shadow:0 0 12px rgba(255,0,0,0.5);transition:all .2s;
}
#btnExit:hover{box-shadow:0 0 26px rgba(255,0,0,.9);transform:scale(1.05);}

/* ===== GAME CANVAS ===== */
#gameCanvas{position:fixed;top:52px;left:0;width:100vw;height:calc(100vh - 52px);display:none;z-index:5;}

/* ===== MOBILE CONTROLS ===== */
#mobileControls{position:fixed;bottom:16px;left:0;right:0;display:none;justify-content:space-between;padding:0 20px;z-index:200;pointer-events:none;}
#mobileControls.visible{display:flex;}
.mob-btn{
  background:rgba(79,195,247,0.12);border:2px solid rgba(79,195,247,0.35);
  border-radius:50%;width:64px;height:64px;display:flex;align-items:center;justify-content:center;
  font-size:26px;cursor:pointer;pointer-events:all;user-select:none;-webkit-user-select:none;
  backdrop-filter:blur(8px);transition:background .1s;
}
.mob-btn:active{background:rgba(79,195,247,0.32);}
.left-g{display:flex;gap:10px;}
.right-g{display:flex;gap:10px;}

/* ===== LEVEL TRANSITION ===== */
#lvlTransition{position:fixed;inset:0;background:rgba(2,8,24,0.97);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:300;}
#lvlTransition.visible{display:flex;}
.lt-num{font-family:'Orbitron',monospace;font-size:clamp(14px,3vw,20px);color:#7B61FF;letter-spacing:4px;margin-bottom:8px;animation:fadeUp .4s ease-out;}
.lt-title{font-family:'Orbitron',monospace;font-size:clamp(34px,8vw,62px);font-weight:900;color:#fff;text-shadow:0 0 40px #4FC3F7;margin-bottom:8px;animation:zoomIn .5s ease-out;}
.lt-theme{font-size:clamp(14px,3vw,20px);color:#4FC3F7;letter-spacing:3px;margin-bottom:14px;animation:zoomIn .65s ease-out;}
.lt-tip{font-size:13px;color:rgba(150,190,240,0.6);letter-spacing:1px;animation:fadeUp .8s ease-out;}
@keyframes zoomIn{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadeUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ===== DAMAGE FLASH ===== */
#dmgFlash{position:fixed;inset:0;background:rgba(255,0,0,0);pointer-events:none;z-index:90;transition:background .05s;}

/* ===== WIN SCREEN ===== */
#winScreen{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 50%,#0a1628,#020818);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:400;overflow:hidden;}
#winScreen.visible{display:flex;}
#winCanvas{position:absolute;inset:0;width:100%;height:100%;}
.win-label{
  position:relative;z-index:10;text-align:center;
  font-family:'Orbitron',monospace;font-weight:900;
  font-size:clamp(26px,7vw,58px);
  color:#FFD700;
  text-shadow:0 0 50px rgba(255,215,0,.9),0 0 100px rgba(255,150,0,.5),0 4px 20px rgba(0,0,0,0.8);
  animation:winPulse 1.2s ease-in-out infinite;
  display:none;letter-spacing:3px;
}
.win-sub{position:relative;z-index:10;font-size:16px;color:rgba(200,230,255,0.8);margin-top:12px;letter-spacing:2px;display:none;text-align:center;}
@keyframes winPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* ===== PAUSE ===== */
#pauseOverlay{position:fixed;inset:0;background:rgba(2,8,24,0.85);display:none;align-items:center;justify-content:center;z-index:250;font-family:'Orbitron',monospace;font-size:clamp(22px,5vw,40px);color:#4FC3F7;flex-direction:column;gap:18px;}
#pauseOverlay.visible{display:flex;}
.pause-hint{font-size:13px;color:rgba(150,200,255,0.5);letter-spacing:1px;}
</style>
</head>
<body>

<div id="menuScreen">
  <img class="menu-bg-img" id="menuCatImg" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 1200'%3E%3Crect width='800' height='1200' fill='%23020818'/%3E%3Ccircle cx='400' cy='400' r='200' fill='%23333'/%3E%3Ccircle cx='320' cy='340' r='30' fill='white'/%3E%3Ccircle cx='480' cy='340' r='30' fill='white'/%3E%3Ccircle cx='320' cy='340' r='15' fill='black'/%3E%3Ccircle cx='480' cy='340' r='15' fill='black'/%3E%3Cpath d='M360 420 Q400 460 440 420' stroke='white' stroke-width='8' fill='none' stroke-linecap='round'/%3E%3Crect x='340' y='520' width='120' height='200' rx='20' fill='%2344f'/%3E%3Cpath d='M300 580 L340 520 M500 580 L460 520' stroke='%2344f' stroke-width='30' stroke-linecap='round'/%3E%3C/svg%3E">
  <div class="menu-overlay"></div>
  <div class="menu-top">
    <div class="btn-music-menu" id="musicToggle">🔊</div>
  </div>
  <div class="menu-bottom">
    <div class="menu-paw">🐱🚀</div>
    <div class="menu-title">MAAT ASTRONAUTA</div>
    <div class="menu-subtitle">¡Salta entre planetas!</div>
    <div class="menu-controls">← →  |  Click / Tap</div>
    <button class="btn-launch" id="launchBtn">LANZAR AL ESPACIO</button>
  </div>
</div>

<div id="topBar">
  <div class="hud-brand">🚀 MAAT</div>
  <div class="hud-level">NIVEL <span id="levelNum">1</span></div>
  <div class="hud-score">⭐ <span id="scoreVal">0</span></div>
  <div class="hud-lives" id="livesDisplay">❤️❤️❤️</div>
  <button id="btnExit">SALIR</button>
</div>

<canvas id="gameCanvas"></canvas>

<div id="mobileControls">
  <div class="left-g"><div class="mob-btn" id="mobLeft">◀</div></div>
  <div class="right-g"><div class="mob-btn" id="mobRight">▶</div><div class="mob-btn" id="mobJump">⬆️</div></div>
</div>

<div id="lvlTransition"><div class="lt-num">NIVEL <span id="lvlNumSpan">1</span></div><div class="lt-title">¡AL ESPACIO!</div><div class="lt-theme">✨🌙✨</div><div class="lt-tip">Cuidado con los bordes</div></div>
<div id="dmgFlash"></div>
<div id="winScreen"><canvas id="winCanvas"></canvas><div class="win-label">¡MISIÓN COMPLETA!</div><div class="win-sub">🌸 Volviste a casa 🌸</div></div>
<div id="pauseOverlay"><div>⏸️ PAUSA</div><div class="pause-hint">Toca / Click para continuar</div></div>

<script>
(function(){
  // Configuración del canvas
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let width, height;
  
  // Elementos del DOM
  const menuScreen = document.getElementById('menuScreen');
  const topBar = document.getElementById('topBar');
  const launchBtn = document.getElementById('launchBtn');
  const exitBtn = document.getElementById('btnExit');
  const mobileControls = document.getElementById('mobileControls');
  const levelNumSpan = document.getElementById('levelNum');
  const scoreValSpan = document.getElementById('scoreVal');
  const livesDisplay = document.getElementById('livesDisplay');
  const musicToggle = document.getElementById('musicToggle');
  const lvlTransition = document.getElementById('lvlTransition');
  const dmgFlash = document.getElementById('dmgFlash');
  
  // Variables del juego
  let gameRunning = false;
  let animationId = null;
  let level = 1;
  let score = 0;
  let lives = 3;
  let gamePaused = false;
  let bgMusic = null;
  let isMuted = false;
  
  // Controles móviles
  let leftPressed = false, rightPressed = false, jumpRequested = false;
  
  // Variables de la gata
  let cat = { x: 100, y: 0, vy: 0, width: 40, height: 40 };
  const GRAVITY = 0.8;
  const JUMP_POWER = -12;
  const MOVE_SPEED = 5;
  
  // Plataformas
  let platforms = [];
  let cameraY = 0;
  let gameHeight = 0;
  const PLATFORM_WIDTH = 80;
  const PLATFORM_HEIGHT = 20;
  
  // Funciones auxiliares
  function updateDisplay() {
    levelNumSpan.textContent = level;
    scoreValSpan.textContent = score;
    const hearts = lives > 0 ? '❤️'.repeat(lives) + '🖤'.repeat(3-lives) : '🖤🖤🖤';
    livesDisplay.textContent = hearts;
  }
  
  function flashDamage() {
    dmgFlash.style.transition = 'background 0.1s';
    dmgFlash.style.background = 'rgba(255,0,0,0.5)';
    setTimeout(() => { dmgFlash.style.background = 'rgba(255,0,0,0)'; }, 150);
  }
  
  function showLevelTransition() {
    document.getElementById('lvlNumSpan').textContent = level;
    lvlTransition.classList.add('visible');
    setTimeout(() => { lvlTransition.classList.remove('visible'); }, 1800);
  }
  
  function gameOver() {
    gameRunning = false;
    if(animationId) cancelAnimationFrame(animationId);
    alert(`¡Juego terminado! Puntuación final: ${score}`);
    menuScreen.classList.remove('hidden');
    topBar.classList.remove('visible');
    mobileControls.classList.remove('visible');
  }
  
  function nextLevel() {
    level++;
    score += 100;
    updateDisplay();
    showLevelTransition();
    initLevel();
  }
  
  function loseLife() {
    lives--;
    updateDisplay();
    flashDamage();
    if(lives <= 0) {
      gameOver();
    } else {
      respawnCat();
    }
  }
  
  function respawnCat() {
    cat.x = width/2 - cat.width/2;
    cat.y = platforms[0]?.y - cat.height || 100;
    cat.vy = 0;
    // Asegurar que no quede dentro de la plataforma
    if(platforms.length > 0 && cat.y + cat.height > platforms[0].y && cat.y < platforms[0].y + PLATFORM_HEIGHT) {
      cat.y = platforms[0].y - cat.height;
    }
  }
  
  function generatePlatforms() {
    const newPlatforms = [];
    const startY = height - 80;
    const platformCount = 12 + level * 2;
    const minGap = 50;
    const maxGap = 120;
    
    newPlatforms.push({ x: width/2 - PLATFORM_WIDTH/2, y: startY, w: PLATFORM_WIDTH, h: PLATFORM_HEIGHT });
    
    let lastY = startY;
    for(let i = 1; i < platformCount; i++) {
      let y = lastY - (minGap + Math.random() * maxGap);
      if(y < 50) y = 50 + Math.random() * 100;
      let x = 20 + Math.random() * (width - PLATFORM_WIDTH - 20);
      newPlatforms.push({ x, y, w: PLATFORM_WIDTH, h: PLATFORM_HEIGHT });
      lastY = y;
    }
    gameHeight = lastY - 200;
    if(gameHeight < 0) gameHeight = 0;
    return newPlatforms;
  }
  
  function initLevel() {
    platforms = generatePlatforms();
    cat.x = width/2 - cat.width/2;
    if(platforms.length > 0) {
      cat.y = platforms[0].y - cat.height;
    } else {
      cat.y = height - 100;
    }
    cat.vy = 0;
    cameraY = 0;
    updateDisplay();
  }
  
  // Colisiones y actualización
  function updateGame() {
    if(!gameRunning || gamePaused) return;
    
    // Movimiento horizontal
    if(leftPressed) cat.x -= MOVE_SPEED;
    if(rightPressed) cat.x += MOVE_SPEED;
    
    // Límites laterales
    if(cat.x < 0) cat.x = 0;
    if(cat.x + cat.width > width) cat.x = width - cat.width;
    
    // Gravedad
    cat.vy += GRAVITY;
    cat.y += cat.vy;
    
    // Colisiones con plataformas
    let onGround = false;
    for(let p of platforms) {
      if(cat.vy >= 0 && 
         cat.x + cat.width > p.x && 
         cat.x < p.x + p.w && 
         cat.y + cat.height <= p.y + 5 && 
         cat.y + cat.height + cat.vy >= p.y) {
        cat.y = p.y - cat.height;
        cat.vy = 0;
        onGround = true;
        break;
      }
    }
    
    // Salto
    if(jumpRequested && onGround) {
      cat.vy = JUMP_POWER;
      jumpRequested = false;
    } else if(jumpRequested) {
      jumpRequested = false;
    }
    
    // Caída al vacío
    if(cat.y + cat.height > height) {
      loseLife();
      return;
    }
    
    // Cámara
    let targetCamera = cat.y - height/2;
    if(targetCamera > gameHeight) targetCamera = gameHeight;
    if(targetCamera < 0) targetCamera = 0;
    cameraY = cameraY * 0.9 + targetCamera * 0.1;
    
    // Verificar si llegó al final (cerca del tope)
    if(cat.y - cameraY < 80 && platforms.length > 0 && platforms[platforms.length-1].y - cameraY < 200) {
      nextLevel();
      return;
    }
    
    // Recolectar estrellas ficticias (cada 2 segundos de juego)
  }
  
  // Dibujo
  function draw() {
    ctx.clearRect(0, 0, width, height);
    
    // Fondo estrellado
    ctx.fillStyle = '#020818';
    ctx.fillRect(0, 0, width, height);
    for(let i = 0; i < 150; i++) {
      if(i%2 === 0) continue;
      ctx.fillStyle = `rgba(255,255,200,${0.3+Math.sin(Date.now()*0.001+i)*0.2})`;
      ctx.beginPath();
      ctx.arc((i*131)%width, (i*97 + cameraY*0.3)%height, 1.5, 0, Math.PI*2);
      ctx.fill();
    }
    
    // Plataformas
    for(let p of platforms) {
      const screenY = p.y - cameraY;
      if(screenY + p.h < 0 || screenY > height) continue;
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#4FC3F7';
      ctx.fillStyle = `hsl(${200 + p.y * 0.1}, 70%, 55%)`;
      ctx.fillRect(p.x, screenY, p.w, p.h);
      ctx.fillStyle = '#fff8';
      ctx.fillRect(p.x + 5, screenY, p.w - 10, 4);
    }
    ctx.shadowBlur = 0;
    
    // Gata astronauta
    const catScreenY = cat.y - cameraY;
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#7B61FF';
    ctx.fillStyle = '#FFB347';
    ctx.beginPath();
    ctx.ellipse(cat.x + cat.width/2, catScreenY + cat.height/2, cat.width/2, cat.height/2, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(cat.x + 12, catScreenY + 15, 5, 0, Math.PI*2);
    ctx.arc(cat.x + 28, catScreenY + 15, 5, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(cat.x + 10, catScreenY + 13, 2, 0, Math.PI*2);
    ctx.arc(cat.x + 26, catScreenY + 13, 2, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#FF69B4';
    ctx.beginPath();
    ctx.ellipse(cat.x + 20, catScreenY + 28, 10, 6, 0, 0, Math.PI*2);
    ctx.fill();
    
    // Casco
    ctx.strokeStyle = '#aaffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(cat.x + cat.width/2, catScreenY + cat.height/2 - 5, cat.width/2 + 3, cat.height/2 - 2, 0, 0, Math.PI*2);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
  
  // Reiniciar juego completo
  function startGame() {
    level = 1;
    score = 0;
    lives = 3;
    updateDisplay();
    initLevel();
    gameRunning = true;
    gamePaused = false;
    menuScreen.classList.add('hidden');
    topBar.classList.add('visible');
    mobileControls.classList.add('visible');
    if(animationId) cancelAnimationFrame(animationId);
    gameLoop();
  }
  
  // Música (simulada)
  function toggleMusic() {
    isMuted = !isMuted;
    musicToggle.textContent = isMuted ? '🔇' : '🔊';
    if(bgMusic) bgMusic.muted = isMuted;
  }
  
  // Event listeners
  function handleKeyDown(e) {
    if(!gameRunning) return;
    if(e.key === 'ArrowLeft') leftPressed = true;
    if(e.key === 'ArrowRight') rightPressed = true;
    if(e.key === 'ArrowUp' || e.key === ' ') {
      e.preventDefault();
      jumpRequested = true;
    }
    if(e.key === 'Escape' && gameRunning) {
      gamePaused = !gamePaused;
      document.getElementById('pauseOverlay').classList.toggle('visible', gamePaused);
    }
  }
  
  function handleKeyUp(e) {
    if(e.key === 'ArrowLeft') leftPressed = false;
    if(e.key === 'ArrowRight') rightPressed = false;
  }
  
  function resizeCanvas() {
    width = window.innerWidth;
    height = window.innerHeight - 52;
    canvas.width = width;
    canvas.height = height;
    if(!gameRunning) return;
    initLevel();
  }
  
  function gameLoop() {
    if(!gameRunning) return;
    updateGame();
    draw();
    animationId = requestAnimationFrame(gameLoop);
  }
  
  // Configurar eventos
  window.addEventListener('resize', () => { resizeCanvas(); if(gameRunning) initLevel(); });
  document.addEventListener('keydown', handleKeyDown);
  document.addEventListener('keyup', handleKeyUp);
  
  document.getElementById('mobLeft').addEventListener('touchstart', (e) => { e.preventDefault(); leftPressed = true; });
  document.getElementById('mobLeft').addEventListener('touchend', () => { leftPressed = false; });
  document.getElementById('mobRight').addEventListener('touchstart', (e) => { e.preventDefault(); rightPressed = true; });
  document.getElementById('mobRight').addEventListener('touchend', () => { rightPressed = false; });
  document.getElementById('mobJump').addEventListener('click', (e) => { e.preventDefault(); if(gameRunning && !gamePaused) jumpRequested = true; });
  document.getElementById('mobJump').addEventListener('touchstart', (e) => { e.preventDefault(); if(gameRunning && !gamePaused) jumpRequested = true; });
  
  launchBtn.addEventListener('click', () => { startGame(); });
  exitBtn.addEventListener('click', () => { gameRunning = false; if(animationId) cancelAnimationFrame(animationId); menuScreen.classList.remove('hidden'); topBar.classList.remove('visible'); mobileControls.classList.remove('visible'); });
  musicToggle.addEventListener('click', toggleMusic);
  
  document.getElementById('pauseOverlay').addEventListener('click', () => {
    gamePaused = false;
    document.getElementById('pauseOverlay').classList.remove('visible');
  });
  
  resizeCanvas();
  initLevel();
})();
</script>
</body>
</html>
