<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Maat Astronauta 🚀🐱</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;700&display=swap');

  :root {
    --space-deep: #020818;
    --space-mid: #0a1628;
    --moon-silver: #c8d8f0;
    --star-gold: #ffe97a;
    --nebula-purple: #7c3aed;
    --nebula-pink: #db2777;
    --suit-white: #dde8f5;
    --suit-grey: #8fa8c8;
    --visor-blue: #3b82f6;
    --accent-cyan: #22d3ee;
    --accent-purple: #7c3aed;
    --accent-pink: #db2777;
    --accent-orange: #f97316;
    --accent-green: #10b981;
  }

  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }

  body {
    background: var(--space-deep);
    overflow: hidden;
    font-family: 'Exo 2', sans-serif;
    width: 100vw; height: 100vh;
    cursor: crosshair;
  }

  #gameCanvas {
    display: block;
    position: absolute;
    top: 0; left: 0;
  }

  /* ── HUD ── */
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between;
    pointer-events: none; z-index: 10;
  }
  .hud-pill {
    background: rgba(2,8,24,0.7);
    border: 1px solid rgba(34,211,238,0.3);
    border-radius: 50px;
    padding: 7px 18px;
    display: flex; align-items: center; gap: 10px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 20px rgba(34,211,238,0.1), inset 0 1px 0 rgba(255,255,255,0.08);
    transition: border-color 0.5s, box-shadow 0.5s;
  }
  .hud-score {
    font-family: 'Orbitron', monospace;
    font-size: clamp(14px, 2.5vw, 20px);
    color: var(--star-gold);
    letter-spacing: 2px;
    text-shadow: 0 0 12px rgba(255,233,122,0.6);
  }
  .hud-level {
    font-family: 'Orbitron', monospace;
    font-size: clamp(11px, 1.8vw, 15px);
    color: var(--accent-cyan);
    letter-spacing: 3px;
    text-shadow: 0 0 10px rgba(34,211,238,0.5);
    transition: color 0.5s, text-shadow 0.5s;
  }
  .hud-lives {
    font-size: clamp(14px, 2.5vw, 20px);
    letter-spacing: 3px;
  }

  /* ── OVERLAY ── */
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20;
    background: rgba(2,8,24,0.88);
    backdrop-filter: blur(8px);
    transition: opacity 0.5s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }

  .overlay-card {
    background: linear-gradient(160deg, rgba(10,22,40,0.97) 0%, rgba(20,10,50,0.97) 100%);
    border: 1px solid rgba(34,211,238,0.25);
    border-radius: 28px;
    padding: clamp(28px,5vw,52px) clamp(32px,6vw,64px);
    text-align: center;
    box-shadow: 0 0 80px rgba(34,211,238,0.08), 0 40px 80px rgba(0,0,0,0.7);
    max-width: min(520px, 92vw);
    position: relative;
    overflow: hidden;
  }
  .overlay-card::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(124,58,237,0.15) 0%, transparent 70%);
    pointer-events: none;
  }

  .overlay-exit-label {
    position: absolute;
    top: 12px; right: 18px;
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    letter-spacing: 3px;
    color: rgba(200,216,240,0.45);
    text-shadow: 0 0 8px rgba(255,255,255,0.1);
    pointer-events: none;
  }

  .overlay-icon { font-size: clamp(52px,10vw,80px); margin-bottom: 8px; animation: floatIcon 3s ease-in-out infinite; }
  @keyframes floatIcon { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

  .overlay-title {
    font-family: 'Orbitron', monospace;
    font-size: clamp(22px,5vw,42px);
    font-weight: 900;
    color: #fff;
    letter-spacing: 3px;
    text-shadow: 0 0 30px rgba(34,211,238,0.5), 0 0 60px rgba(124,58,237,0.3);
    margin-bottom: 6px;
  }
  .overlay-sub {
    font-size: clamp(12px,2vw,15px);
    color: rgba(200,216,240,0.65);
    margin-bottom: 28px;
    line-height: 1.7;
    letter-spacing: 0.5px;
  }
  .overlay-score-big {
    font-family: 'Orbitron', monospace;
    font-size: clamp(16px,3vw,24px);
    color: var(--accent-cyan);
    margin-bottom: 24px;
    text-shadow: 0 0 15px rgba(34,211,238,0.5);
  }

  .btn-launch {
    font-family: 'Orbitron', monospace;
    font-size: clamp(14px,2.5vw,18px);
    font-weight: 700;
    letter-spacing: 2px;
    padding: 14px 44px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, #22d3ee, #7c3aed);
    color: #fff;
    box-shadow: 0 8px 30px rgba(34,211,238,0.35), 0 0 0 1px rgba(255,255,255,0.1);
    transition: transform 0.15s, box-shadow 0.15s;
    pointer-events: all;
    position: relative;
    overflow: hidden;
  }
  .btn-launch::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
  }
  .btn-launch:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 14px 40px rgba(34,211,238,0.5); }
  .btn-launch:active { transform: scale(0.96); }

  /* ── CONTROLES TÁCTILES ── */
  #touchControls {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 170px; z-index: 10;
    pointer-events: none; display: none;
  }
  #touchControls.active { display: flex; pointer-events: all; }

  .t-dpad { position: absolute; bottom: 22px; left: 18px; display: flex; gap: 10px; }
  .t-btn {
    width: 66px; height: 66px;
    background: rgba(34,211,238,0.1);
    border: 1.5px solid rgba(34,211,238,0.3);
    border-radius: 16px;
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; color: rgba(34,211,238,0.9);
    cursor: pointer; transition: background 0.1s, transform 0.1s;
    pointer-events: all;
  }
  .t-btn.pressed, .t-btn:active { background: rgba(34,211,238,0.28); transform: scale(0.92); }
  .t-jump {
    position: absolute; bottom: 22px; right: 18px;
    width: 82px; height: 82px; border-radius: 50%;
    background: rgba(124,58,237,0.18);
    border: 1.5px solid rgba(124,58,237,0.5);
    font-size: 28px; display: flex; align-items: center; justify-content: center;
    color: rgba(167,139,250,0.9);
  }

  /* ── FLOAT TEXT ── */
  .float-text {
    position: absolute;
    font-family: 'Orbitron', monospace;
    font-size: clamp(14px,2.5vw,20px);
    color: var(--star-gold);
    text-shadow: 0 0 10px rgba(255,233,122,0.8);
    pointer-events: none; z-index: 30;
    animation: floatUp 1s ease-out forwards;
    white-space: nowrap;
  }
  @keyframes floatUp {
    0%{opacity:1;transform:translateY(0) scale(1)}
    100%{opacity:0;transform:translateY(-70px) scale(1.25)}
  }

  /* ── SHAKE ── */
  @keyframes hudShake {
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-7px)}
    40%{transform:translateX(7px)}
    60%{transform:translateX(-4px)}
    80%{transform:translateX(4px)}
  }
  .hud-shake { animation: hudShake 0.38s ease; }

  /* ── MUSIC TOGGLE ── */
  #musicBtn {
    position: absolute; top: 14px; right: 18px;
    z-index: 25; pointer-events: all;
    background: rgba(2,8,24,0.7);
    border: 1px solid rgba(34,211,238,0.3);
    border-radius: 50%;
    width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; cursor: pointer;
    backdrop-filter: blur(8px);
    transition: transform 0.2s, background 0.2s;
  }
  #musicBtn:hover { transform: scale(1.15); background: rgba(34,211,238,0.15); }

  /* scanline effect */
  body::after {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:99;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
  }

/* ─────────────────────────────────────────
   PANTALLA PRINCIPAL PRO
───────────────────────────────────────── */

.cover-title {
  position: absolute;
  top: 25px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Orbitron';
  font-size: clamp(18px, 2vw, 28px);
  color: white;
  opacity: 0.9;
  letter-spacing: 4px;
  text-shadow: 0 0 20px rgba(255,255,255,0.2);
}

.hero-img {
  width: 180px;
  border-radius: 24px;
  margin-bottom: 8px;
  margin-top: 0px;
  filter: drop-shadow(0 0 30px rgba(34,211,238,0.45));
  animation: heroFloat 4s ease-in-out infinite;
}

@keyframes heroFloat {
  0%,100% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
}

.overlay-card {
  backdrop-filter: blur(18px);
  border: 1px solid rgba(34,211,238,0.25);
  animation: fadeInUp 0.8s ease;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(40px) scale(0.95);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.btn-launch {
  animation: glowPulse 2s infinite;
}

@keyframes glowPulse {
  0% { box-shadow: 0 0 10px rgba(34,211,238,0.4); }
  50% { box-shadow: 0 0 35px rgba(124,58,237,0.8); }
  100% { box-shadow: 0 0 10px rgba(34,211,238,0.4); }
}

.btn-launch:hover {
  transform: translateY(-4px) scale(1.04);
}

body {
  animation: bgMove 10s ease-in-out infinite alternate;
}

@keyframes bgMove {
  from { background-position: 0 0; }
  to { background-position: 0 30px; }
}


.music-floating{
  position:absolute;
  top:24px;
  right:24px;
  width:64px;
  height:64px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,0.15);
  background:rgba(0,0,0,0.25);
  color:white;
  font-size:28px;
  cursor:pointer;
  z-index:5;
  backdrop-filter: blur(8px);
}

.overlay-exit{
  position:absolute;
  top:24px;
  right:110px;
  width:78px;
  height:78px;
  border:none;
  border-radius:50%;
  background:#ff3b30;
  color:white;
  font-family:'Orbitron';
  font-size:20px;
  cursor:pointer;
  box-shadow:0 0 25px rgba(255,59,48,.65);
  z-index:100;
  pointer-events: all;
  display: flex;
  align-items: center;
  justify-content: center;
}

.overlay-card{
  background:rgba(9,11,35,0.55)!important;
  border-radius:34px!important;
  padding-top:clamp(60px,8vw,90px)!important;
  padding-bottom:clamp(24px,4vw,40px)!important;
  width:min(88vw,540px)!important;
  max-height:95vh;
  overflow-y:auto;
}

.overlay-title{
  font-size: clamp(26px, 5vw, 54px)!important;
  text-shadow: 0 0 25px rgba(34,211,238,0.75);
}

.overlay-sub{
  font-size: clamp(13px,2vw,18px)!important;
  opacity:0.9;
}

.hero-img{
  width:clamp(120px,30vw,220px)!important;
  margin-bottom: 10px !important;
  margin-top: -20px !important;
}

.btn-launch{
  width:85%!important;
  border-radius:999px!important;
  font-size:clamp(15px,2vw,22px)!important;
  padding:16px 24px!important;
}


  /* ── RESPONSIVE MOBILE ── */
  @media (max-width: 600px) {
    #hud { padding: 8px 10px; }
    .hud-pill { padding: 5px 10px; gap: 6px; }
    #musicBtn { width: 36px; height: 36px; font-size: 16px; top: 10px; right: 10px; }
    .t-btn { width: 56px; height: 56px; font-size: 20px; }
    .t-jump { width: 70px; height: 70px; font-size: 24px; }
    .t-dpad { bottom: 14px; left: 10px; gap: 8px; }
    .t-jump-pos { bottom: 14px; right: 10px; }
    #touchControls { height: 140px; }
    .music-floating { width: 48px; height: 48px; font-size: 20px; top: 14px; right: 14px; }
  }
  @media (max-height: 500px) {
    .hero-img { width: 80px!important; margin-bottom: 6px; }
    .overlay-title { font-size: clamp(18px,4vw,28px)!important; }
    .overlay-card { padding-top: 40px!important; }
  }
</style>
</head>

<canvas id="gameCanvas"></canvas>

<div id="hud">
  <div class="hud-pill" id="hudScorePill">
    <span style="font-size:18px">🧶</span>
    <span class="hud-score" id="scoreDisplay">000</span>
  </div>
  <div class="hud-pill hud-level" id="levelDisplay">ÓRBITA 1</div>
  <div class="hud-pill" id="hudLivesPill">
    <span class="hud-lives" id="livesDisplay">🐾🐾🐾</span>
  </div>
</div>

  cursor:pointer;
  box-shadow:0 0 14px rgba(255,59,48,.4);

  backdrop-filter:blur(6px);
