<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐱🚀 Maat Astronauta - Corregido</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#020818;font-family:'Exo 2',sans-serif;overflow:hidden;width:100vw;height:100vh;touch-action:none;}

/* ===== MENU ===== */
#menuScreen{
  position:fixed;inset:0;z-index:50;background:#020818;
  display:flex;flex-direction:column;
}
#menuScreen.hidden{display:none;}
.menu-bg-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;
  background:#020818;
  object-position:center center;
}
.menu-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(2,8,24,0.1) 0%,rgba(2,8,24,0.0) 30%,rgba(2,8,24,0.65) 60%,rgba(2,8,24,0.97) 100%);
}
.menu-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:flex-end;align-items:center;padding:20px 22px;gap:12px;z-index:5;}
.btn-exit-menu{
  background:radial-gradient(circle,#ff3333,#aa0000);
  border:2.5px solid rgba(255,80,80,0.55);color:#fff;
  font-family:'Orbitron',monospace;font-weight:700;font-size:13px;letter-spacing:1px;
  padding:10px 22px;border-radius:50px;cursor:pointer;
  box-shadow:0 0 22px rgba(255,0,0,0.65);transition:all .2s;
}
.btn-exit-menu:hover{box-shadow:0 0 38px rgba(255,0,0,.9);transform:scale(1.05);}
.btn-music-menu{
  background:rgba(10,22,60,0.7);border:2px solid rgba(79,195,247,0.4);
  border-radius:50%;width:50px;height:50px;display:flex;align-items:center;justify-content:center;
  font-size:20px;cursor:pointer;backdrop-filter:blur(10px);transition:all .2s;
}
.btn-music-menu:hover{background:rgba(79,195,247,0.2);}
.btn-music-menu.muted{opacity:0.45;}
.menu-bottom{
  position:absolute;bottom:0;left:0;right:0;
  display:flex;flex-direction:column;align-items:center;
  padding:0 28px 52px;z-index:5;
}
.menu-paw{font-size:30px;margin-bottom:8px;filter:drop-shadow(0 0 8px rgba(79,195,247,0.6));}
.menu-title{
  font-family:'Orbitron',monospace;font-weight:900;
  font-size:clamp(24px,7vw,42px);letter-spacing:4px;
  color:#fff;text-shadow:0 0 30px rgba(79,195,247,0.9),0 2px 8px rgba(0,0,0,0.8);
  margin-bottom:10px;text-align:center;
}
.menu-subtitle{color:rgba(180,215,255,0.75);font-size:14px;letter-spacing:1.5px;margin-bottom:6px;text-align:center;}
.menu-controls{color:rgba(150,185,235,0.55);font-size:12px;margin-bottom:30px;text-align:center;}
.btn-launch{
  background:linear-gradient(135deg,#4FC3F7,#7B61FF);
  border:none;border-radius:50px;padding:18px 0;width:100%;max-width:400px;
  font-family:'Orbitron',monospace;font-size:16px;font-weight:700;
  color:#fff;letter-spacing:3px;cursor:pointer;
  box-shadow:0 4px 40px rgba(79,195,247,0.55);transition:all .2s;position:relative;overflow:hidden;
}
.btn-launch::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.18),transparent);border-radius:50px;}
.btn-launch:hover{transform:scale(1.03);box-shadow:0 6px 55px rgba(79,195,247,0.85);}
.btn-launch:active{transform:scale(0.97);}

/* ===== TOP BAR ===== */
#topBar{
  position:fixed;top:0;left:0;right:0;height:52px;
  background:rgba(2,8,24,0.93);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(79,195,247,0.2);
  display:none;align-items:center;justify-content:space-between;
  padding:0 14px;z-index:100;
}
#topBar.visible{display:flex;}
.hud-brand{font-family:'Orbitron',monospace;font-size:11px;color:#4FC3F7;letter-spacing:2px;}
.hud-level{font-family:'Orbitron',monospace;font-size:12px;color:#7B61FF;}
.hud-score{font-family:'Orbitron',monospace;font-size:14px;color:#FFD700;}
.hud-lives{font-size:16px;letter-spacing:2px;}
#btnExit{
  background:radial-gradient(circle,#ff4444,#cc0000);
  border:2px solid rgba(255,100,100,0.5);color:#fff;
  font-family:'Orbitron',monospace;font-size:10px;font-weight:700;
  padding:5px 12px;border-radius:50px;cursor:pointer;letter-spacing:1px;
  box-shadow:0 0 12px rgba(255,0,0,0.5);transition:all .2s;
}
#btnExit:hover{box-shadow:0 0 26px rgba(255,0,0,.9);transform:scale(1.05);}

/* ===== GAME CANVAS ===== */
#gameCanvas{position:fixed;top:52px;left:0;width:100vw;height:calc(100vh - 52px);display:none;z-index:5;}

/* ===== MOBILE CONTROLS ===== */
#mobileControls{position:fixed;bottom:16px;left:0;right:0;display:none;justify-content:space-between;padding:0 20px;z-index:200;pointer-events:none;}
#mobileControls.visible{display:flex;}
.mob-btn{
  background:rgba(79,195,247,0.12);border:2px solid rgba(79,195,247,0.35);
  border-radius:50%;width:64px;height:64px;display:flex;align-items:center;justify-content:center;
  font-size:26px;cursor:pointer;pointer-events:all;user-select:none;-webkit-user-select:none;
  backdrop-filter:blur(8px);transition:background .1s;
}
.mob-btn:active{background:rgba(79,195,247,0.32);}
.left-g{display:flex;gap:10px;}
.right-g{display:flex;gap:10px;}

/* ===== LEVEL TRANSITION ===== */
#lvlTransition{position:fixed;inset:0;background:rgba(2,8,24,0.97);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:300;}
#lvlTransition.visible{display:flex;}
.lt-num{font-family:'Orbitron',monospace;font-size:clamp(14px,3vw,20px);color:#7B61FF;letter-spacing:4px;margin-bottom:8px;animation:fadeUp .4s ease-out;}
.lt-title{font-family:'Orbitron',monospace;font-size:clamp(34px,8vw,62px);font-weight:900;color:#fff;text-shadow:0 0 40px #4FC3F7;margin-bottom:8px;animation:zoomIn .5s ease-out;}
.lt-theme{font-size:clamp(14px,3vw,20px);color:#4FC3F7;letter-spacing:3px;margin-bottom:14px;animation:zoomIn .65s ease-out;}
.lt-tip{font-size:13px;color:rgba(150,190,240,0.6);letter-spacing:1px;animation:fadeUp .8s ease-out;}
@keyframes zoomIn{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadeUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ===== DAMAGE FLASH ===== */
#dmgFlash{position:fixed;inset:0;background:rgba(255,0,0,0);pointer-events:none;z-index:90;transition:background .05s;}

/* ===== WIN SCREEN ===== */
#winScreen{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 50%,#0a1628,#020818);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:400;overflow:hidden;}
#winScreen.visible{display:flex;}
#winCanvas{position:absolute;inset:0;width:100%;height:100%;}
.win-label{
  position:relative;z-index:10;text-align:center;
  font-family:'Orbitron',monospace;font-weight:900;
  font-size:clamp(26px,7vw,58px);
  color:#FFD700;
  text-shadow:0 0 50px rgba(255,215,0,.9),0 0 100px rgba(255,150,0,.5),0 4px 20px rgba(0,0,0,0.8);
  animation:winPulse 1.2s ease-in-out infinite;
  display:none;letter-spacing:3px;
}
.win-sub{position:relative;z-index:10;font-size:16px;color:rgba(200,230,255,0.8);margin-top:12px;letter-spacing:2px;display:none;text-align:center;}
@keyframes winPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* ===== PAUSE ===== */
#pauseOverlay{position:fixed;inset:0;background:rgba(2,8,24,0.85);display:none;align-items:center;justify-content:center;z-index:250;font-family:'Orbitron',monospace;font-size:clamp(22px,5vw,40px);color:#4FC3F7;flex-direction:column;gap:18px;}
#pauseOverlay.visible{display:flex;}
.pause-hint{font-size:13px;color:rgba(150,200,255,0.5);letter-spacing:1px;}

/* ===== STARS TWINKLE ===== */
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.15;transform:scale(0.4)}}
</style>
</head>
<body>

<div id="menuScreen">
  <img class="menu-bg-img" id="menuCatImg" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 600'%3E%3Crect width='800' height='600' fill='%23020818'/%3E%3Ccircle cx='400' cy='250' r='80' fill='%234FC3F7' opacity='0.3'/%3E%3Ccircle cx='300' cy='180' r='40' fill='%237B61FF' opacity='0.2'/%3E%3Ccircle cx='500' cy='200' r='50' fill='%234FC3F7' opacity='0.25'/%3E%3Ctext x='400' y='300' text-anchor='middle' fill='white' font-size='30' font-family='Orbitron' font-weight='bold'%3E🐱🚀%3C/text%3E%3C/svg%3E">
  <div class="menu-overlay"></div>
  <div class="menu-top">
    <div class="btn-music-menu" id="musicToggle">🔊</div>
    <div class="btn-exit-menu" id="exitGameBtn">SALIR</div>
  </div>
  <div class="menu-bottom">
    <div class="menu-paw">🐾</div>
    <div class="menu-title">MAAT ASTRONAUTA</div>
    <div class="menu-subtitle">🐱🚀 ESPACIO INFINITO</div>
    <div class="menu-controls">← →  |  ESPACIO / CLICK ↑</div>
    <button class="btn-launch" id="launchBtn">LANZAR 🚀</button>
  </div>
</div>

<div id="topBar">
  <div class="hud-brand">🐱 MAAT ASTRONAUTA</div>
  <div class="hud-level">NIVEL <span id="levelNum">1</span></div>
  <div class="hud-score">⭐ <span id="scoreNum">0</span></div>
  <div class="hud-lives" id="livesDisplay">❤️❤️❤️</div>
  <div id="btnExit">SALIR</div>
</div>

<canvas id="gameCanvas"></canvas>

<div id="mobileControls">
  <div class="left-g">
    <div class="mob-btn" id="mobLeft">◀</div>
    <div class="mob-btn" id="mobRight">▶</div>
  </div>
  <div class="right-g">
    <div class="mob-btn" id="mobJump">▲</div>
  </div>
</div>

<div id="lvlTransition">
  <div class="lt-num" id="ltNum">NIVEL 1</div>
  <div class="lt-title">🌟 PREPÁRATE 🌟</div>
  <div class="lt-theme" id="ltTheme">🌈 SUBIENDO... 🚀</div>
  <div class="lt-tip">💫 EVITA LOS EXTRATERRESTRES 💫</div>
</div>

<div id="dmgFlash"></div>

<div id="winScreen">
  <canvas id="winCanvas"></canvas>
  <div class="win-label">✨ ¡VICTORIA! ✨</div>
  <div class="win-sub">Has completado todos los niveles</div>
</div>

<div id="pauseOverlay">
  <div>⏸ PAUSA</div>
  <div class="pause-hint">Presiona ESPACIO o TAP para continuar</div>
</div>

<script>
  (function(){
    // ---------- DOM elementos ----------
    const menuScreen = document.getElementById('menuScreen');
    const topBar = document.getElementById('topBar');
    const gameCanvas = document.getElementById('gameCanvas');
    const mobileControls = document.getElementById('mobileControls');
    const launchBtn = document.getElementById('launchBtn');
    const exitGameBtn = document.getElementById('exitGameBtn');
    const btnExit = document.getElementById('btnExit');
    const musicToggle = document.getElementById('musicToggle');
    const levelNumSpan = document.getElementById('levelNum');
    const scoreNumSpan = document.getElementById('scoreNum');
    const livesDisplay = document.getElementById('livesDisplay');
    const lvlTransition = document.getElementById('lvlTransition');
    const ltNum = document.getElementById('ltNum');
    const ltTheme = document.getElementById('ltTheme');
    const dmgFlash = document.getElementById('dmgFlash');
    const winScreen = document.getElementById('winScreen');
    const pauseOverlay = document.getElementById('pauseOverlay');

    // ---------- Canvas y contexto ----------
    const ctx = gameCanvas.getContext('2d');
    let canvasWidth = 800;
    let canvasHeight = 500;
    
    // ---------- Variables del juego ----------
    let gameRunning = false;
    let paused = false;
    let animationId = null;
    let score = 0;
    let lives = 3;
    let currentLevel = 1;
    let invincibleFrames = 0;
    const INVINCIBLE_DURATION = 30; // frames
    
    // ---------- Elementos del juego ----------
    let cat = {
      x: 100,
      y: 0,
      width: 40,
      height: 40,
      vy: 0,
      onGround: true,
      facingRight: true
    };
    
    let platforms = [];
    let enemies = [];
    
    // Configuración de gravedad y salto
    const GRAVITY = 0.8;
    const JUMP_POWER = -12;
    
    // Controles
    let leftPressed = false;
    let rightPressed = false;
    let jumpPressed = false;
    let canJump = true;
    
    // Efectos visuales
    let cameraX = 0;
    
    // Colores de enemigos por nivel
    const enemyColors = [
      '#FF4444', // nivel 1 - rojo
      '#FF8844', // nivel 2 - naranja
      '#FFDD44', // nivel 3 - amarillo
      '#44FF44', // nivel 4 - verde
      '#44AAFF', // nivel 5 - azul
      '#AA44FF', // nivel 6 - violeta
      '#FF44FF'  // nivel 7+ - rosa
    ];
    
    // ---------- Funciones auxiliares ----------
    function updateLivesDisplay() {
      let hearts = '';
      for(let i=0; i<lives; i++) hearts += '❤️ ';
      for(let i=lives; i<3; i++) hearts += '🖤 ';
      livesDisplay.textContent = hearts.trim();
    }
    
    function updateUI() {
      scoreNumSpan.textContent = score;
      levelNumSpan.textContent = currentLevel;
      updateLivesDisplay();
    }
    
    function showLevelTransition(level) {
      ltNum.textContent = `NIVEL ${level}`;
      const themes = ['🌙 LUNA', '🚀 ASTEROIDES', '🛸 OVNI', '🌟 NEBULOSA', '💫 GALAXIA', '🌠 COMETA'];
      ltTheme.textContent = themes[(level-1) % themes.length] + ' ' + ['🌈','✨','⭐','💫','🌟','🔥'][(level-1)%6];
      lvlTransition.classList.add('visible');
      setTimeout(() => {
        lvlTransition.classList.remove('visible');
      }, 1800);
    }
    
    function damageEffect() {
      dmgFlash.style.background = 'rgba(255,0,0,0.6)';
      setTimeout(() => { dmgFlash.style.background = 'rgba(255,0,0,0)'; }, 200);
    }
    
    function loseLife() {
      if(invincibleFrames > 0) return;
      lives--;
      updateLivesDisplay();
      invincibleFrames = INVINCIBLE_DURATION;
      damageEffect();
      if(lives <= 0) {
        gameOver();
      }
    }
    
    function gameOver() {
      gameRunning = false;
      if(animationId) cancelAnimationFrame(animationId);
      alert('💀 GAME OVER 💀\nPuntuación: ' + score);
      resetToMenu();
    }
    
    function winGame() {
      gameRunning = false;
      if(animationId) cancelAnimationFrame(animationId);
      winScreen.classList.add('visible');
      setTimeout(() => {
        winScreen.classList.remove('visible');
        resetToMenu();
      }, 3000);
    }
    
    function resetToMenu() {
      gameRunning = false;
      if(animationId) cancelAnimationFrame(animationId);
      gameCanvas.style.display = 'none';
      topBar.classList.remove('visible');
      mobileControls.classList.remove('visible');
      menuScreen.classList.remove('hidden');
      // Reiniciar variables
      score = 0;
      lives = 3;
      currentLevel = 1;
      enemies = [];
      updateUI();
    }
    
    // ---------- Generación de plataformas ----------
    function generateLevel() {
      platforms = [];
      enemies = [];
      
      // Plataforma base (suelo) - AHORA SÍ EXISTE
      platforms.push({
        x: 0,
        y: canvasHeight - 40,
        width: canvasWidth,
        height: 40
      });
      
      // Número de plataformas según nivel
      const platformCount = Math.min(5 + Math.floor(currentLevel / 2), 12);
      let lastX = 80;
      let lastY = canvasHeight - 100;
      
      for(let i = 0; i < platformCount; i++) {
        let x = lastX + 80 + Math.random() * 120;
        let y = Math.max(50, Math.min(canvasHeight - 80, lastY - 40 + Math.random() * 80 - 20));
        let width = 70 + Math.random() * 50;
        
        platforms.push({
          x: x,
          y: y,
          width: width,
          height: 20
        });
        
        // Añadir enemigo con probabilidad del 35% en plataformas que no sean el suelo
        if(i > 0 && Math.random() < 0.35) {
          const enemyColor = enemyColors[(currentLevel-1) % enemyColors.length];
          enemies.push({
            x: x + width/2 - 15,
            y: y - 25,
            width: 30,
            height: 25,
            vx: (Math.random() * 2 + 1) * (Math.random() > 0.5 ? 1 : -1),
            color: enemyColor
          });
        }
        
        lastX = x;
        lastY = y;
      }
      
      // Posicionar la gata en la primera plataforma
      cat.x = 100;
      cat.y = platforms[0].y - cat.height;
      cat.vy = 0;
      cat.onGround = true;
    }
    
    // ---------- Actualización de física ----------
    function updatePhysics() {
      // Aplicar gravedad
      cat.vy += GRAVITY;
      cat.y += cat.vy;
      
      // Colisión con plataformas
      cat.onGround = false;
      for(let plat of platforms) {
        if(cat.y + cat.height > plat.y && cat.y < plat.y + plat.height &&
           cat.x + cat.width > plat.x && cat.x < plat.x + plat.width) {
          if(cat.vy >= 0 && cat.y + cat.height - cat.vy <= plat.y + 5) {
            cat.y = plat.y - cat.height;
            cat.vy = 0;
            cat.onGround = true;
            canJump = true;
          }
        }
      }
      
      // Movimiento horizontal
      let move = 0;
      if(leftPressed) move = -5;
      if(rightPressed) move = 5;
      cat.x += move;
      
      // Límites laterales
      if(cat.x < 0) cat.x = 0;
      if(cat.x + cat.width > canvasWidth) cat.x = canvasWidth - cat.width;
      
      // Reiniciar salto
      if(jumpPressed && cat.onGround && canJump) {
        cat.vy = JUMP_POWER;
        cat.onGround = false;
        canJump = false;
      }
      
      // Actualizar invencibilidad
      if(invincibleFrames > 0) invincibleFrames--;
      
      // Actualizar enemigos y colisiones
      for(let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        e.x += e.vx;
        // Rebote en bordes
        if(e.x < 0 || e.x + e.width > canvasWidth) e.vx *= -1;
        
        // Colisión gata-enemigo
        if(invincibleFrames === 0 &&
           cat.x < e.x + e.width && cat.x + cat.width > e.x &&
           cat.y < e.y + e.height && cat.y + cat.height > e.y) {
          loseLife();
          enemies.splice(i,1);
          i--;
        }
      }
      
      // Aumentar puntuación y nivel al llegar al final
      if(cat.x > canvasWidth - 150 && score % 500 < 50) {
        score += 50;
        updateUI();
        let newLevel = Math.floor(score / 500) + 1;
        if(newLevel > currentLevel) {
          currentLevel = newLevel;
          showLevelTransition(currentLevel);
          generateLevel();
          // Centrar gata
          cat.x = 100;
          cat.y = platforms[0].y - cat.height;
        }
        updateUI();
      }
      
      // Caída al vacío
      if(cat.y > canvasHeight) {
        loseLife();
        cat.y = platforms[0].y - cat.height;
        cat.x = 100;
        cat.vy = 0;
      }
      
      // Actualizar cámara
      cameraX = cat.x - canvasWidth/2;
      if(cameraX < 0) cameraX = 0;
      if(cameraX > 2000) cameraX = 2000;
    }
    
    // ---------- Dibujo ----------
    function draw() {
      ctx.clearRect(0, 0, canvasWidth, canvasHeight);
      
      // Fondo estrellado
      ctx.fillStyle = '#020818';
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);
      for(let i=0; i<150; i++) {
        if(i%2 === 0) continue;
        ctx.fillStyle = `rgba(255,255,200,${Math.random()*0.5+0.3})`;
        ctx.beginPath();
        ctx.arc(Math.random()*canvasWidth, Math.random()*canvasHeight, Math.random()*2+1, 0, Math.PI*2);
        ctx.fill();
      }
      
      // Plataformas
      for(let plat of platforms) {
        ctx.fillStyle = '#4FC3F7';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#4FC3F7';
        ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
        ctx.fillStyle = '#7B61FF';
        ctx.fillRect(plat.x+5, plat.y-3, plat.width-10, 5);
      }
      ctx.shadowBlur = 0;
      
      // Enemigos
      for(let e of enemies) {
        ctx.fillStyle = e.color;
        ctx.shadowBlur = 5;
        ctx.fillRect(e.x, e.y, e.width, e.height);
        ctx.fillStyle = '#000';
        ctx.fillRect(e.x+5, e.y+5, 6, 6);
        ctx.fillRect(e.x+e.width-11, e.y+5, 6, 6);
        ctx.fillStyle = '#fff';
        ctx.fillRect(e.x+7, e.y+7, 3, 3);
        ctx.fillRect(e.x+e.width-9, e.y+7, 3, 3);
      }
      
      // Gata astronauta
      if(invincibleFrames > 0 && (Math.floor(Date.now()/50)%4 < 2)) {
        ctx.globalAlpha = 0.5;
      }
      ctx.fillStyle = '#FFB347';
      ctx.shadowBlur = 10;
      ctx.fillRect(cat.x, cat.y, cat.width, cat.height);
      ctx.fillStyle = '#FF8844';
      ctx.fillRect(cat.x+5, cat.y-8, 30, 10);
      ctx.fillStyle = '#fff';
      ctx.fillRect(cat.x+8, cat.y+8, 8, 8);
      ctx.fillRect(cat.x+24, cat.y+8, 8, 8);
      ctx.fillStyle = '#000';
      ctx.fillRect(cat.x+10, cat.y+10, 4, 4);
      ctx.fillRect(cat.x+26, cat.y+10, 4, 4);
      ctx.fillStyle = '#FFAAAA';
      ctx.fillRect(cat.x+16, cat.y+20, 8, 5);
      ctx.fillStyle = '#CCC';
      ctx.fillRect(cat.x+12, cat.y-4, 16, 6);
      ctx.globalAlpha = 1;
      
      // Texto indicador
      ctx.font = 'bold 14px Orbitron';
      ctx.fillStyle = '#FFD700';
      ctx.fillText('⭐ ' + score, canvasWidth-80, 30);
      ctx.fillStyle = '#4FC3F7';
      ctx.fillText('NIVEL ' + currentLevel, canvasWidth-80, 55);
      
      ctx.shadowBlur = 0;
    }
    
    // ---------- Bucle del juego ----------
    function gameLoop() {
      if(!gameRunning || paused) {
        if(!gameRunning) return;
        requestAnimationFrame(gameLoop);
        return;
      }
      
      updatePhysics();
      draw();
      
      animationId = requestAnimationFrame(gameLoop);
    }
    
    // ---------- Iniciar juego ----------
    function startGame() {
      score = 0;
      lives = 3;
      currentLevel = 1;
      enemies = [];
      updateUI();
      generateLevel();
      cat.x = 100;
      cat.y = platforms[0].y - cat.height;
      cat.vy = 0;
      invincibleFrames = 0;
      
      gameRunning = true;
      paused = false;
      pauseOverlay.classList.remove('visible');
      menuScreen.classList.add('hidden');
      gameCanvas.style.display = 'block';
      topBar.classList.add('visible');
      mobileControls.classList.add('visible');
      
      if(animationId) cancelAnimationFrame(animationId);
      animationId = requestAnimationFrame(gameLoop);
    }
    
    // ---------- Controles ----------
    function handleKeyDown(e) {
      if(!gameRunning) return;
      if(e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        if(paused) {
          paused = false;
          pauseOverlay.classList.remove('visible');
        } else {
          jumpPressed = true;
        }
      }
      if(e.code === 'ArrowLeft') { leftPressed = true; e.preventDefault(); }
      if(e.code === 'ArrowRight') { rightPressed = true; e.preventDefault(); }
      if(e.code === 'KeyP') {
        if(gameRunning) {
          paused = !paused;
          if(paused) pauseOverlay.classList.add('visible');
          else pauseOverlay.classList.remove('visible');
        }
      }
    }
    
    function handleKeyUp(e) {
      if(e.code === 'ArrowLeft') leftPressed = false;
      if(e.code === 'ArrowRight') rightPressed = false;
      if(e.code === 'Space' || e.code === 'ArrowUp') jumpPressed = false;
    }
    
    // ---------- Eventos ----------
    window.addEventListener('load', () => {
      // Ajustar tamaño del canvas
      const resize = () => {
        canvasWidth = window.innerWidth;
        canvasHeight = window.innerHeight - 52;
        gameCanvas.width = canvasWidth;
        gameCanvas.height = canvasHeight;
        generateLevel();
      };
      window.addEventListener('resize', resize);
      resize();
      
      document.addEventListener('keydown', handleKeyDown);
      document.addEventListener('keyup', handleKeyUp);
      
      launchBtn.addEventListener('click', startGame);
      exitGameBtn.addEventListener('click', resetToMenu);
      btnExit.addEventListener('click', resetToMenu);
      
      // Controles móviles
      document.getElementById('mobLeft').addEventListener('touchstart', (e) => { e.preventDefault(); leftPressed = true; });
      document.getElementById('mobLeft').addEventListener('touchend', () => { leftPressed = false; });
      document.getElementById('mobRight').addEventListener('touchstart', (e) => { e.preventDefault(); rightPressed = true; });
      document.getElementById('mobRight').addEventListener('touchend', () => { rightPressed = false; });
      document.getElementById('mobJump').addEventListener('touchstart', (e) => { e.preventDefault(); if(!paused) jumpPressed = true; });
      document.getElementById('mobJump').addEventListener('touchend', () => { jumpPressed = false; });
      
      // Música toggle (placeholder)
      let muted = false;
      musicToggle.addEventListener('click', () => {
        muted = !muted;
        musicToggle.textContent = muted ? '🔇' : '🔊';
      });
    });
  })();
</script>
</body>
</html>
